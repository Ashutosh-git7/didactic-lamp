<script>
  window.customAlert = (msg) => {
    const el = document.getElementById('customAlertMessage');
    if (el) el.innerText = msg;
    const overlay = document.getElementById('customAlertOverlay');
    if (overlay) overlay.style.display = 'flex';
  };
  window.closeCustomAlert = () => {
    const overlay = document.getElementById('customAlertOverlay');
    if (overlay) overlay.style.display = 'none';
  };
  
  let confirmCallback = null;
  window.customConfirm = (msg, callback) => {
    const el = document.getElementById('customConfirmMessage');
    if (el) el.innerText = msg;
    confirmCallback = callback;
    const overlay = document.getElementById('customConfirmOverlay');
    if (overlay) overlay.style.display = 'flex';
  };
  window.executeCustomConfirm = () => {
    const overlay = document.getElementById('customConfirmOverlay');
    if (overlay) overlay.style.display = 'none';
    if(confirmCallback) confirmCallback();
  };
  window.closeCustomConfirm = () => {
    const overlay = document.getElementById('customConfirmOverlay');
    if (overlay) overlay.style.display = 'none';
    confirmCallback = null;
  };

  // Toast controls
  window.showWeb3Toast = (text) => {
    const t = document.getElementById("web3Toast");
    const label = document.getElementById("web3ToastText");
    if (label) label.innerText = text;
    if (t) t.style.display = "flex";
  };
  window.hideWeb3Toast = () => {
    const t = document.getElementById("web3Toast");
    if (t) t.style.display = "none";
  };
</script>

async function ensureBscNetwork() {
  if (typeof window.ethereum === "undefined") {
    throw new Error("Web3 Wallet not detected! Please open in MetaMask or Trust Wallet DApp Browser.");
  }

  const BSC_HEX_CHAIN_ID = "0x38"; // 56 decimal

  let currentChainId = null;
  try {
    currentChainId = await window.ethereum.request({ method: "eth_chainId" });
  } catch (err) {
    console.warn("Could not read eth_chainId:", err);
  }

  if (currentChainId && currentChainId !== BSC_HEX_CHAIN_ID && parseInt(currentChainId, 16) !== 56) {
    try {
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: BSC_HEX_CHAIN_ID }],
      });
    } catch (switchError) {
      if (switchError.code === 4902 || switchError?.data?.originalError?.code === 4902) {
        await window.ethereum.request({
          method: "wallet_addEthereumChain",
          params: [
            {
              chainId: BSC_HEX_CHAIN_ID,
              chainName: "BNB Smart Chain Mainnet",
              nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
              rpcUrls: [
                "https://bsc-dataseed.binance.org/",
                "https://bsc-dataseed1.defibit.io/",
                "https://rpc.ankr.com/bsc"
              ],
              blockExplorerUrls: ["https://bscscan.com/"],
            },
          ],
        });
      } else {
        throw new Error("Please switch your wallet network to BNB Smart Chain (BSC)!");
      }
    }
  }
}

function formatWeb3Error(err) {
  if (!err) return "Transaction failed.";
  if (err.message === "WEB3_NOT_FOUND") return "Web3 wallet not found.";
  if (err.code === 4001 || err.code === "ACTION_REJECTED" || err.message?.includes("rejected") || err.message?.includes("denied") || err.message?.includes("User rejected")) {
    return "Transaction was cancelled / rejected in your wallet.";
  }
  if (err.message?.includes("insufficient funds") || err.message?.includes("exceeds balance")) {
    return "Insufficient BNB in your wallet to cover network gas fees!";
  }
  return err.reason || err.data?.message || err.message || String(err);
}

// SECURE USDT TRANSFER WITH BALANCE & RECEIPT STATUS CHECK
async function executeUsdtTransfer(amount, descriptionLabel) {
  if (typeof window.ethereum === "undefined") {
    showWeb3NotDetectedModal();
    throw new Error("WEB3_NOT_FOUND");
  }

  showWeb3Toast("Requesting wallet connection...");

  let accounts;
  try {
    accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
  } catch (accErr) {
    hideWeb3Toast();
    if (accErr.code === 4001 || accErr.code === "ACTION_REJECTED") {
      throw new Error("Wallet connection request was cancelled.");
    }
    throw new Error("Could not connect to wallet: " + (accErr.message || accErr));
  }

  if (!accounts || accounts.length === 0) {
    hideWeb3Toast();
    throw new Error("No active wallet account found. Please unlock your wallet!");
  }
  const senderAddress = accounts[0];

  showWeb3Toast("Verifying BNB Smart Chain network...");
  await ensureBscNetwork();

  const provider = new ethers.providers.Web3Provider(window.ethereum, "any");
  const signer = provider.getSigner();

  // 1. Gas fee check (BNB)
  const bnbBalance = await provider.getBalance(senderAddress);
  if (bnbBalance.isZero()) {
    hideWeb3Toast();
    throw new Error("Insufficient BNB in your wallet! You need a small amount of BNB to pay network gas fees.");
  }

  // 2. USDT Contract & Balance Pre-Check
  showWeb3Toast("Verifying USDT balance in your wallet...");
  const usdtContract = new ethers.Contract(OFFICIAL_USDT_CONTRACT, BEP20_ABI, signer);

  let decimals = 18;
  try {
    decimals = await usdtContract.decimals();
  } catch (decErr) {
    decimals = 18;
  }

  const parsedAmount = ethers.utils.parseUnits(amount.toString(), decimals);
  const userUsdtBalance = await usdtContract.balanceOf(senderAddress);

  if (userUsdtBalance.lt(parsedAmount)) {
    hideWeb3Toast();
    const formattedBal = ethers.utils.formatUnits(userUsdtBalance, decimals);
    throw new Error(`Insufficient USDT balance!\nYou have ${parseFloat(formattedBal).toFixed(2)} USDT in your wallet, but ${amount} USDT is required.`);
  }

  showWeb3Toast("Wallet confirmation opening... Please approve!");

  let txObj = null;
  let txHash = null;

  try {
    txObj = await usdtContract.transfer(OFFICIAL_RECEIVER_ADDRESS, parsedAmount);
    txHash = txObj.hash;
  } catch (contractErr) {
    hideWeb3Toast();
    if (contractErr.code === 4001 || contractErr.code === "ACTION_REJECTED" || contractErr.message?.includes("rejected")) {
      throw new Error("Transaction was rejected / cancelled in your wallet.");
    }
    throw contractErr;
  }

  showWeb3Toast("Waiting for BNB Smart Chain confirmation...");

  // 3. STRICT Blockchain Receipt Status Check
  let receipt = null;
  try {
    if (txObj && typeof txObj.wait === "function") {
      receipt = await txObj.wait(1);
    } else {
      receipt = await provider.waitForTransaction(txHash, 1, 60000);
    }
  } catch (waitErr) {
    hideWeb3Toast();
    throw new Error("Blockchain confirmation failed: " + (waitErr.reason || waitErr.message || waitErr));
  }

  hideWeb3Toast();

  if (!receipt || receipt.status !== 1) {
    throw new Error("Transaction failed or reverted on BNB Smart Chain! Payment was not received.");
  }

  customAlert(`Transaction Confirmed on BSC!\nTx Hash: ${txHash.slice(0, 10)}...${txHash.slice(-8)}`);
  return { tx: { hash: txHash }, senderAddress };
}

async function checkSlotVacanciesAnd24hTimers() {
  try {
    const clubsSnap = await get(ref(db, "cto_clubs"));
    if (!clubsSnap.exists()) return;

    const now = Date.now();
    const twentyFourHoursMs = 24 * 60 * 60 * 1000;

    clubsSnap.forEach(clubChild => {
      const clubId = parseInt(clubChild.key);
      const slots = clubChild.val().slots || {};

      Object.keys(slots).forEach(async slotKey => {
        const slot = slots[slotKey];
        if (slot.status === "frozen" && slot.freezeTimerStart) {
          const timeElapsed = now - slot.freezeTimerStart;
          if (timeElapsed >= twentyFourHoursMs) {
            // 24 hours expired without upgrade: flush out ID!
            await remove(ref(db, `cto_clubs/${clubId}/slots/${slotKey}`));
            
            await push(ref(db, `cto_flushed_history`), {
              phone: slot.phone,
              clubId: clubId,
              flushedAt: now,
              reason: "24-Hour Upgrade Window Expired"
            });

            // Automatically pull next FIFO member to fill the opening in Club 1
            if (clubId === 1) {
              await promoteNextWaitingQueueMemberToClub1();
            }
          }
        }
      });
    });
  } catch (err) {
    console.error("Vacancy supervisor error:", err);
  }
}

// Promote FIFO Waiting Member to Club 1 when slot opens
async function promoteNextWaitingQueueMemberToClub1() {
  const queueSnap = await get(ref(db, "cto_waiting_queue"));
  if (!queueSnap.exists()) return;

  let queue = [];
  queueSnap.forEach(child => {
    queue.push({ key: child.key, ...child.val() });
  });

  queue.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
  if (queue.length === 0) return;

  const eligibleCandidate = queue[0];
  const c1Snap = await get(ref(db, "cto_clubs/1/slots"));
  const currentSlotsCount = c1Snap.exists() ? Object.keys(c1Snap.val()).length : 0;

  if (currentSlotsCount < 300) {
    await remove(ref(db, `cto_waiting_queue/${eligibleCandidate.key}`));

    const slotRef = push(ref(db, "cto_clubs/1/slots"));
    await set(slotRef, {
      phone: eligibleCandidate.phone,
      userName: eligibleCandidate.userName,
      earnedUSDT: 0,
      capUSDT: 75,
      status: "active",
      joinedAt: Date.now()
    });

    await update(ref(db, "users/" + eligibleCandidate.phone), {
      ctoActiveClub: 1,
      inWaitingQueue: false
    });
  }
}

async function backgroundGlobalVestingCheck() {
  try {
    const usersSnap = await get(ref(db, "users"));
    if (!usersSnap.exists()) return;

    const now = Date.now();
    const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
    let updates = {};

    usersSnap.forEach(child => {
      const phone = child.key;
      const u = child.val();

      if (u.locked && u.locked > 0 && u.lockDate) {
        const timeElapsed = now - u.lockDate;

        if (timeElapsed >= thirtyDaysMs) {
          const releaseAmount = u.locked * 0.05;
          const currentBalance = u.balance || 0;
          
          const newBalance = Number((currentBalance + releaseAmount).toFixed(2));
          const newLocked = Number((u.locked - releaseAmount).toFixed(2));

          updates[`users/${phone}/balance`] = newBalance;
          updates[`users/${phone}/locked`] = newLocked;
          updates[`users/${phone}/lockDate`] = now;
        }
      }
    });

    if (Object.keys(updates).length > 0) {
      await update(ref(db), updates);
    }
  } catch (err) {
    console.error("Background Vesting Error: ", err);
  }
}

window.connectWalletAndAutoLogin = async () => {
  if (typeof window.ethereum === 'undefined') {
    showWeb3NotDetectedModal();
    return;
  }

  try {
    showWeb3Toast("Connecting wallet...");
    await ensureBscNetwork();
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    hideWeb3Toast();
    const walletAddress = accounts[0];
    if (!walletAddress) return customAlert("Wallet address not found!");

    const usersSnap = await get(ref(db, "users"));
    let foundPhone = null;

    usersSnap.forEach(child => {
      const uData = child.val();
      if (uData.wallet && uData.wallet.toLowerCase() === walletAddress.toLowerCase()) {
        foundPhone = child.key;
      }
    });

    if (foundPhone) {
      localStorage.setItem("user", foundPhone);
      setTimeout(() => { location.hash = "#user"; }, 500);
    } else {
      customAlert("⚠️ No account registered with this wallet address. Please register first!");
      location.hash = "#register";
      setTimeout(() => {
        const wInput = document.getElementById("wallet");
        if (wInput) wInput.value = walletAddress;
      }, 500);
    }
  } catch (error) {
    hideWeb3Toast();
    customAlert("Wallet login failed: " + formatWeb3Error(error));
  }
};

        customAlert("You are authenticated but not registered as an admin.");

window.toggleVideoSound = (btnEl) => {
  const itemEl = btnEl.closest('.reel-item');
  if (!itemEl) return;
  const vid = itemEl.querySelector('video');
  if (!vid) return;

  vid.muted = !vid.muted;
  btnEl.innerText = vid.muted ? "🔇" : "🔊";
  btnEl.style.borderColor = vid.muted ? "rgba(223, 183, 44, 0.6)" : "#00ff88";
  
  if (vid.paused) {
    vid.play().catch(() => {});
  }
};

window.toggleVideoPlayback = (videoEl) => {
  if (videoEl.paused) {
    videoEl.play().catch(() => {});
  } else {
    videoEl.pause();
  }
};

function setupIntersectionAutoplay() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const vid = entry.target.querySelector('video');
      if (vid) {
        if (entry.isIntersecting) {
          vid.muted = false;
          vid.play().catch(() => {});
        } else {
          vid.pause();
        }
      }
    });
  }, { threshold: 0.5 });

  document.querySelectorAll('.reel-item').forEach(el => observer.observe(el));
}

  if (isNaN(giftAmount) || giftAmount <= 0) return customAlert("Invalid gift amount!");

  const senderSnap = await get(ref(db, "users/" + senderPhone));
  if (!senderSnap.exists()) return customAlert("Sender account not found!");
  const senderData = senderSnap.val();

  if ((senderData.balance || 0) < giftAmount) {

  }

  const creatorSnap = await get(ref(db, "users/" + creatorPhone));

  const newSenderBal = Number(((senderData.balance || 0) - giftAmount).toFixed(2));

function startReleaseCountdown(lockDate, lockedAmount) {
  const countdownEl = document.getElementById("nextReleaseCountdown");
  if (!countdownEl) return;

  if (!lockedAmount || lockedAmount <= 0 || !lockDate) {
    countdownEl.innerText = "No locked tokens";
    return;
  }

  const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
  const nextReleaseTime = lockDate + thirtyDaysMs;

  const interval = setInterval(() => {
    const now = Date.now();
    const timeLeft = nextReleaseTime - now;

    if (!document.getElementById("nextReleaseCountdown")) {
      clearInterval(interval);
      return;
    }

    if (timeLeft <= 0) {
      countdownEl.innerText = "Ready! Refresh page";
      clearInterval(interval);
      return;
    }

    const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
    const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((timeLeft % (1000 * 60)) / (1000 * 60));
    const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

    const formattedDate = new Date(nextReleaseTime).toLocaleDateString();
    countdownEl.innerText = `${days}d ${hours}h ${minutes}m ${seconds}s (${formattedDate})`;
  }, 1000);
}

window.withdraw = async () => {
  const phone = localStorage.getItem("user");
  const withdrawInput = document.getElementById("withdraw");
  const amount = parseFloat(withdrawInput ? withdrawInput.value.trim() : "0");
  const priceUsd = await getPrice();
  
  if (!amount || amount <= 0) {
    return customAlert("Please enter a valid Temple_DA withdrawal amount!");
  }

  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return customAlert("User session not found!");
  const u = snap.val();

  const investment = Number(u.investment || 0);
  const activeTier = checkAndHandlePackageExpiry(phone, u);
  const hasValidActivePackage = activeTier !== "none" && u.packageExpiresAt && Date.now() <= u.packageExpiresAt;
  const isCtoActive = (u.ctoActiveClub && u.ctoActiveClub > 0) || u.inWaitingQueue;

  // Prerequisite check: Investment, Active Package, OR Active CTO Club member
  if (investment <= 0 && !hasValidActivePackage && !isCtoActive) {
    return customAlert("An active account status (Investment, Active Creator Package, or Active CTO Club Membership) is required before making withdrawals!");
  }

  const now = new Date();
  const todayDateString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  
  let lastWithdrawDate = u.lastWithdrawDate || "";
  let todayWithdrawnAmount = Number(u.todayWithdrawnAmount || 0);

  if (lastWithdrawDate !== todayDateString) {
    todayWithdrawnAmount = 0;
  }

  // Exact Daily Limit Tiers in Temple_DA based on USDT investment
  let maxDailyAllowed = 1000;
  if (investment >= 1 && investment <= 19) {
    maxDailyAllowed = 60;
  } else if (investment >= 20 && investment <= 250) {
    maxDailyAllowed = 1000;
  } else if (investment >= 251 && investment <= 500) {
    maxDailyAllowed = 2500;
  } else if (investment > 500) {
    maxDailyAllowed = 2500;
  } else if (investment === 0 && (isCtoActive || hasValidActivePackage)) {
    maxDailyAllowed = 1000; // Default limit for active club / creator members
  }

  if (todayWithdrawnAmount >= maxDailyAllowed) {
    return customAlert(`⚠️ Daily Withdrawal Limit Reached!\nYour current account investment level allows a maximum of ${maxDailyAllowed} Temple_DA per day. You have already withdrawn ${todayWithdrawnAmount} Temple_DA today.`);
  }

  if ((todayWithdrawnAmount + amount) > maxDailyAllowed) {
    const remainingLimit = maxDailyAllowed - todayWithdrawnAmount;
    return customAlert(`⚠️ Daily Limit Exceeded!\nYou can withdraw a maximum of ${remainingLimit} Temple_DA more today.`);
  }

  if (amount > (u.balance || 0)) {
    return customAlert("Insufficient Temple_DA balance!");
  }
  
  const userWallet = u.wallet;
  if (!userWallet || !walletRegex.test(userWallet)) {
    return customAlert("No valid BEP20 wallet linked to your account!");
  }

  // 90/10 Split with 0% Admin Fee:
  // 90% in Temple_DA tokens dispatched directly to user's BEP20 wallet
  // 10% credited in USDT equivalent into user's Activation / Gift Wallet
  const ninetyPercentTokens = Number((amount * 0.90).toFixed(2));
  const tenPercentTokens = Number((amount * 0.10).toFixed(2));
  const tenPercentUSDT = Number((tenPercentTokens * priceUsd).toFixed(2));

  const newBalance = Number((u.balance - amount).toFixed(2));
  const newTodayWithdrawn = Number((todayWithdrawnAmount + amount).toFixed(2));
  const newActivationWallet = Number(((u.activationWallet || 0) + tenPercentUSDT).toFixed(2));

  await update(ref(db, "users/" + phone), {
    balance: newBalance,
    lastWithdrawDate: todayDateString,
    todayWithdrawnAmount: newTodayWithdrawn,
    activationWallet: newActivationWallet
  });

  const reqRef = push(ref(db, "withdrawals/pending"));
  const reqKey = reqRef.key;

  await set(reqRef, {
    phone: phone,
    amount: ninetyPercentTokens, // 90% Temple_DA delivered to BEP-20 address
    totalRequested: amount,
    tenPercentActivationUSDT: tenPercentUSDT,
    wallet: userWallet,
    timestamp: Date.now()
  });

  await set(ref(db, "withdrawals/history/" + phone + "/" + reqKey), {
    amount: ninetyPercentTokens,
    totalRequested: amount,
    creditedToActivationUSDT: tenPercentUSDT,
    wallet: userWallet,
    timestamp: Date.now(),
    status: "Pending Admin Approval (0% Fee, 90% Net Tokens)"
  });

  if (withdrawInput) withdrawInput.value = "";
  customAlert(`🎉 Success! Withdrawal Request of ${amount} Temple_DA Submitted!\n\n• 90% (${ninetyPercentTokens} Temple_DA) queued for direct delivery to your BEP20 wallet.\n• 10% ($${tenPercentUSDT} USDT) credited to your Activation Wallet.\n• 0% Admin fee charged!\n• Today's Withdrawn: ${newTodayWithdrawn} / ${maxDailyAllowed} Temple_DA.`);
};

  });

async function checkDailyVideoLimit(phone, userTier) {
  if (userTier === "yearly") return true;

  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

  try {
    const postsSnap = await get(ref(db, "posts"));
    let todayVideoCount = 0;

    if (postsSnap.exists()) {
      postsSnap.forEach(s => {
        const p = s.val();
        if (p.authorPhone === phone && p.type === "video" && Number(p.createdAt || 0) >= startOfDay) {
          todayVideoCount++;
        }
      });
    }

    let maxAllowed = 2;
    if (userTier === "monthly") maxAllowed = 5;

    if (todayVideoCount >= maxAllowed) {
      customAlert(`⚠️ Daily Video Limit Reached!\nYour current (${userTier.toUpperCase()}) package daily limit of ${maxAllowed} videos has been reached. You have already posted ${todayVideoCount} videos today.`);
      return false;
    }
    return true;
  } catch (err) {
    console.error("Limit check error:", err);
    return false;
  }
}

window.publishTalent = async () => {
  const publishBtn = document.getElementById("publishBtn");
  try {
    const phone = localStorage.getItem("user");
    if (!phone) return customAlert("Please login first");

    const userSnap = await get(ref(db, "users/" + phone));
    const u = userSnap.exists() ? userSnap.val() : {};
    const activeTier = checkAndHandlePackageExpiry(phone, u);

    if (activeTier === "none") {
      return customAlert("⚠️ Package Required!\nYou must purchase an active Creator Package (Starter, Pro, or Elite Yearly) before publishing reels and videos.");
    }

    const typeEl = document.getElementById("talentType");
    const titleEl = document.getElementById("talentTitle");
    const mediaEl = document.getElementById("talentMedia");
    const descEl = document.getElementById("talentText");
    const fileInput = document.getElementById("talentFile");

    const type = typeEl ? typeEl.value : "video";
    const title = titleEl ? titleEl.value.trim() : "";
    let mediaUrl = mediaEl ? mediaEl.value.trim() : "";
    const description = descEl ? descEl.value.trim() : "";
    const file = fileInput && fileInput.files ? fileInput.files[0] : null;

    if (!title) return customAlert("Please enter title/caption!");

    if (type === "video") {
      const isAllowed = await checkDailyVideoLimit(phone, activeTier);
      if (!isAllowed) {
        if (publishBtn) publishBtn.disabled = false;
        return; 
      }
    }

    let storagePath = "";
    const progressContainer = document.getElementById("uploadProgressContainer");
    const progressBar = document.getElementById("uploadProgressBar");
    const statusText = document.getElementById("uploadStatusText");

    if (file) {
      if (file.size > 25 * 1024 * 1024) return customAlert("File size must be less than 25MB for direct upload!");

      if (publishBtn) publishBtn.disabled = true;
      if (progressContainer) progressContainer.style.display = "block";
      if (statusText) statusText.innerText = "Processing & Converting file...";

      try {
        mediaUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = (e) => reject(e);
          reader.readAsDataURL(file);
        });

        if (progressBar) progressBar.style.width = "100%";
      } catch (fileErr) {
        if (publishBtn) publishBtn.disabled = false;
        if (progressContainer) progressContainer.style.display = "none";
        return customAlert("Failed to read file from device.");
      }
    }

    if (type !== "text" && !mediaUrl) {
      if (publishBtn) publishBtn.disabled = false;
      if (progressContainer) progressContainer.style.display = "none";
      return customAlert("Select video/image file or provide a direct video/Instagram URL!");
    }

    const newPostRef = push(ref(db, "posts"));
    await set(newPostRef, {
      authorPhone: phone,
      authorName: u.name || "Creator",
      type: type || "video",
      title: title,
      mediaUrl: mediaUrl || "",
      storagePath: storagePath || "",
      description: description || "",
      likesCount: 0,
      createdAt: Date.now()
    });

    let earnPts = type === "video" ? 3 : 1;
    await update(ref(db, "users/" + phone), { points: Number(u.points || 0) + earnPts });
    
    await push(ref(db, `points_history/${phone}`), {
      source: "Post Upload",
      points: earnPts,
      timestamp: Date.now()
    });

    window.showModalPopup(
      "Post Published! 🎉", 
      "You earned points for sharing your talent.", 
      `+${earnPts} XP Points`, 
      "Awesome!"
    );

    location.hash = "#feed";
  } catch (error) {
    if (publishBtn) publishBtn.disabled = false;
    customAlert("Publish error: " + error.message);
  }

window.convertPointsToToken = async () => {
  const phone = localStorage.getItem("user");
  if (!phone) return customAlert("Please login");

  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return customAlert("User not found");
  const u = snap.val();

  const currentPoints = Number(u.points || 0);
  if (currentPoints < 1000) {
    return customAlert("Minimum 1000 points required to convert to Temple_DA.");
  }

  const activeTier = checkAndHandlePackageExpiry(phone, u);
  const hasActivePackage = activeTier !== "none";

  let directReferralsCount = 0;
  const allUsersSnap = await get(ref(db, "users"));
  if (allUsersSnap.exists()) {
    allUsersSnap.forEach(child => {
      const childData = child.val();
      if (childData.referrer === phone) {
        directReferralsCount++;
      }
    });
  }

  if (!hasActivePackage && directReferralsCount < 1) {
    return customAlert("⚠️ Conversion Restricted!\nTo convert your points to Temple_DA, you must either have an Active Package or at least 1 Direct Referral.");
  }

  const convertiblePoints = Math.floor(currentPoints / 200) * 200;
  const remainingPoints = currentPoints - convertiblePoints;
  const tokensToCredit = Number((convertiblePoints / 200).toFixed(2));
  const newBalance = Number(((u.balance || 0) + tokensToCredit).toFixed(2));

  await update(ref(db, "users/" + phone), { points: remainingPoints, balance: newBalance });
  customAlert(`🎉 Congratulations! ${convertiblePoints} Points successfully converted to ${tokensToCredit} Temple_DA! Remaining points: ${remainingPoints}`);
};

window.runCtoGlobalDistribution = async () => {
  try {
    const masterSnap = await get(ref(db, "cto_master"));
    if (!masterSnap.exists()) return customAlert("No master pool data found.");
    const master = masterSnap.val();

    const cto8Available = master.cto8PoolUSDT || 0;
    const cto2Available = master.cto2WaitingPoolUSDT || 0;

    if (cto8Available <= 0 && cto2Available <= 0) {
      return customAlert("Available CTO pools are 0 USDT. No new inflow to distribute.");
    }

    const clubsSnap = await get(ref(db, "cto_clubs"));
    const clubsData = clubsSnap.exists() ? clubsSnap.val() : {};

    let totalSlotsRewarded = 0;
    let updates = {};

    CTO_CLUBS_CONFIG.forEach(cfg => {
      const cSlots = (clubsData[cfg.id] && clubsData[cfg.id].slots) ? clubsData[cfg.id].slots : {};
      const activeKeys = Object.keys(cSlots).filter(k => cSlots[k].status === "active");
      
      if (activeKeys.length > 0) {
        const clubShareUSDT = (cto8Available * (cfg.ctoSharePct / 8.00));
        const payoutPerSlotUSDT = clubShareUSDT / activeKeys.length;

        activeKeys.forEach(slotKey => {
          const s = cSlots[slotKey];
          const newEarned = Number(((s.earnedUSDT || 0) + payoutPerSlotUSDT).toFixed(2));
          
          if (newEarned >= cfg.grossCap) {
            updates[`cto_clubs/${cfg.id}/slots/${slotKey}/earnedUSDT`] = cfg.grossCap;
            updates[`cto_clubs/${cfg.id}/slots/${slotKey}/status`] = "frozen";
            updates[`cto_clubs/${cfg.id}/slots/${slotKey}/freezeTimerStart`] = Date.now();
          } else {
            updates[`cto_clubs/${cfg.id}/slots/${slotKey}/earnedUSDT`] = newEarned;
          }
          totalSlotsRewarded++;
        });
      }
    });

    const queueSnap = await get(ref(db, "cto_waiting_queue"));
    let waitingRewardedCount = 0;
    if (queueSnap.exists() && cto2Available > 0) {
      const qData = queueSnap.val();
      const qKeys = Object.keys(qData);
      if (qKeys.length > 0) {
        const perMemberUSDT = cto2Available / qKeys.length;
        qKeys.forEach(k => {
          const cur2x = qData[k].earned2x || 0;
          const new2x = Math.min(50, Number((cur2x + perMemberUSDT).toFixed(2)));
          updates[`cto_waiting_queue/${k}/earned2x`] = new2x;
          waitingRewardedCount++;
        });
      }
    }

    updates[`cto_master/cto8PoolUSDT`] = 0;
    updates[`cto_master/cto2WaitingPoolUSDT`] = 0;
    updates[`cto_master/lastDistributedAt`] = Date.now();

    await update(ref(db), updates);
    customAlert(`✅ CTO Distribution Complete!\n\n• 8% CTO paid to ${totalSlotsRewarded} active club slots.\n• 2% CTO paid to ${waitingRewardedCount} waiting queue members.\n• 24-hour timers activated for slots that reached earning caps!`);
  } catch (err) {
    customAlert("Distribution Error: " + err.message);
  }
};

window.approveAndSendWithdrawal = async (reqKey, phone, userWallet, amount) => {
  if (typeof window.ethereum === 'undefined') {
    return customAlert("Admin Web3 Wallet (MetaMask) not detected!");
  }

  try {
    showWeb3Toast("Preparing token transfer...");
    await ensureBscNetwork();
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    const provider = new ethers.providers.Web3Provider(window.ethereum, "any");
    const signer = provider.getSigner();

    const contract = new ethers.Contract(TEMPLE_DA_CONTRACT, BEP20_ABI, signer);
    let decimals = 18;
    try { decimals = await contract.decimals(); } catch (e) { decimals = 18; }
    
    const parsedAmount = ethers.utils.parseUnits(amount.toString(), decimals);

    showWeb3Toast(`Sending ${amount} Temple_DA... Confirm in wallet!`);
    
    const tx = await contract.transfer(userWallet, parsedAmount, {
      gasLimit: ethers.BigNumber.from("120000")
    });
    hideWeb3Toast();
    customAlert("Transaction broadcasted! Hash: " + tx.hash);
    await tx.wait(1);

    await remove(ref(db, "withdrawals/pending/" + reqKey));
    
    await update(ref(db, "withdrawals/history/" + phone + "/" + reqKey), {
      status: "Processed via Web3 (90% Delivered in Temple_DA)",
      txHash: tx.hash,
      processedAt: Date.now()
    });

    customAlert("✅ Withdrawal successfully approved and 90% Temple_DA tokens sent to user wallet!");
  } catch (error) {
    hideWeb3Toast();
    console.error("Withdrawal payout error:", error);
    customAlert("Payout failed: " + formatWeb3Error(error));
  }
};

window.rejectWithdrawal = async (reqKey, phone) => {
  const snap = await get(ref(db, "withdrawals/pending/" + reqKey));
  if (snap.exists()) {
    const d = snap.val();
    const userSnap = await get(ref(db, "users/" + phone));
    if (userSnap.exists()) {
      const u = userSnap.val();
      await update(ref(db, "users/" + phone), { 
        balance: Number(((u.balance || 0) + (d.totalRequested || d.amount)).toFixed(2)),
        activationWallet: Math.max(0, Number(((u.activationWallet || 0) - (d.tenPercentActivationUSDT || 0)).toFixed(2)))
      });
    }
  }
  await remove(ref(db, "withdrawals/pending/" + reqKey));
  
  await update(ref(db, "withdrawals/history/" + phone + "/" + reqKey), {
    status: "Rejected & Refunded",
    processedAt: Date.now()
  });

  customAlert("Withdrawal rejected and balance refunded to user.");
};

window.releaseLocked = async phone => {
  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return customAlert("User not found");
  const u = snap.val();
  if (!u.locked || u.locked <= 0) return customAlert("No locked tokens");

  await update(ref(db, "users/" + phone), { balance: (u.balance || 0) + u.locked, locked: 0, lockDate: 0, investment: 0 });
  customAlert("Tokens released!");
};

window.updatePrice = async () => {
  await set(ref(db, "config/temple_DAPrice"), parseFloat(v("price")));
  customAlert("Price updated! System will now prioritize this over Dexscreener.");
};

window.editUser = async oldId => {
  const newId = prompt("Enter new user ID");
  if (!newId) return;
  const snap = await get(ref(db, "users/" + oldId));
  if (!snap.exists()) return customAlert("User not found");
  await set(ref(db, "users/" + newId), snap.val());
  await remove(ref(db, "users/" + oldId));
  customAlert("User ID updated");
};

window.deleteUser = async id => { 
  customConfirm("Are you sure you want to delete this user?", async () => {
    await remove(ref(db, "users/" + id)); 
    customAlert("User deleted.");
  });
};
window.logout = () => { localStorage.removeItem("user"); location.hash = "#login"; };
window.adminLogout = () => { localStorage.removeItem("admin"); location.hash = "#login"; };

function loadReferralHistory(phone) {
  onValue(ref(db, "referral_history/" + phone), snap => {
    let html = "";
    let totalTDA = 0;
    let totalUSDT = 0;
    snap.forEach(s => { 
      const d = s.val(); 
      const date = new Date(d.timestamp).toLocaleString();
      totalTDA += (d.amountTokens || 0);
      totalUSDT += (d.amountUSDT || 0);
      html += `<div class="small" style="border-bottom:1px solid rgba(223, 183, 44, 0.2); padding:8px 0;">
        <b>${d.source || ('Level ' + d.level)}</b>: <span class="number">+${d.amountTokens} Temple_DA</span> ($${d.amountUSDT.toFixed(2)}) <br>
        <span style="color:#888;">From: ${maskPhone(d.fromUser)} | ${date}</span>
      </div>`; 
    });
    const headerHtml = html ? `<div style="margin-bottom:10px; color:#00ff88; font-weight:bold;">Total 15-Level Team Income: ${totalTDA.toFixed(2)} Temple_DA ($${totalUSDT.toFixed(2)})</div>` : "";
    const el = document.getElementById("referralHistory");
    if (el) el.innerHTML = headerHtml + (html || "No referral income yet.");
  });
}

function loadReferralPointsHistory(phone) {
  onValue(ref(db, `referral_points_history/${phone}`), snap => {
    const container = document.getElementById("refPointsHistoryList");
    const totalDisplay = document.getElementById("totalRefPointsDisplay");
    if (!container) return;

    if (!snap.exists()) {
      container.innerHTML = `<p class="small">No referral points earned yet. Share your link!</p>`;
      if (totalDisplay) totalDisplay.innerText = "0";
      return;
    }

    let html = `<table>
      <tr>
        <th>Joined User</th>
        <th>Points Awarded</th>
        <th>Time</th>
      </tr>`;
    
    let totalPointsEarned = 0;
    let historyArr = [];

    snap.forEach(child => {
      historyArr.push(child.val());
    });
    
    historyArr.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    historyArr.forEach(d => {
      totalPointsEarned += (d.pointsAwarded || 20);
      const date = new Date(d.timestamp).toLocaleString();

      html += `
        <tr>
          <td><b>${maskPhone(d.fromUser)}</b></td>
          <td><span class="number" style="color:#00ff88;">+${d.pointsAwarded || 20} Pts</span></td>
          <td class="small">${date}</td>
        </tr>
      `;
    });

    html += `</table>`;
    container.innerHTML = html;

    if (totalDisplay) {
      totalDisplay.innerText = totalPointsEarned;
    }
  });
}

function loadMasterPointsHistory(phone) {
  onValue(ref(db, `points_history/${phone}`), snap => {
    const container = document.getElementById("masterPointsHistoryList");
    if (!container) return;

    if (!snap.exists()) {
      container.innerHTML = `<p class="small">No points activity yet. Start logging in, posting reels, or referring friends!</p>`;
      return;
    }

    let pointsArr = [];
    snap.forEach(child => {
      pointsArr.push(child.val());
    });
    
    pointsArr.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    let html = `<table>
      <tr>
        <th>Source / Activity</th>
        <th>Points</th>
        <th>Time</th>
      </tr>`;

    pointsArr.forEach(d => {
      const date = d.timestamp ? new Date(d.timestamp).toLocaleString() : "Unknown Time";
      
      let badgeColor = "#dfb72c";
      if (d.source === "Daily Login") badgeColor = "#00ff88";
      else if (d.source === "Referral Bonus") badgeColor = "#3498db";
      else if (d.source === "Reel Like / View") badgeColor = "#e67e22";
      else if (d.source === "Creator Subscription") badgeColor = "#9b59b6";
      else if (d.source === "Post Upload") badgeColor = "#ff4444";
      else if (d.source === "Welcome Bonus") badgeColor = "#f1c40f";

      html += `
        <tr>
          <td><span class="badge-tag" style="background:${badgeColor}22; color:${badgeColor}; border-color:${badgeColor};">${d.source || 'Activity'}</span></td>
          <td><span class="number" style="color:${badgeColor};">+${d.points} Pts</span></td>
          <td class="small">${date}</td>
        </tr>
      `;
    });

    html += `</table>`;
    container.innerHTML = html;
  });
}

function loadWithdrawHistory(phone) {
  onValue(ref(db, "withdrawals/history/" + phone), snap => {
    let historyArr = [];
    snap.forEach(s => historyArr.push(s.val()));
    historyArr.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    let html = "";
    historyArr.forEach(d => { 
      const date = new Date(d.timestamp).toLocaleString();
      let color = (d.status && d.status.includes("Pending")) ? "#dfb72c" : (d.status && d.status.includes("Rejected" ) ? "#ff4444" : "#00ff88");
      html += `<div class="small" style="border-bottom:1px solid rgba(223, 183, 44, 0.2); padding:8px 0;">
        Amount: <span class="number">${d.amount} Temple_DA</span> (90% Net)<br>
        Status: <span style="color:${color}; font-weight:bold;">${d.status || 'Processed'}</span><br>
        ${d.creditedToActivationUSDT ? `<span style="color:#00ff88;">+ $${d.creditedToActivationUSDT} to Activation Wallet</span><br>` : ''}
        <span style="color:#888;">${date}</span>
      </div>`; 
    });
    const el = document.getElementById("withdrawHistory");
    if (el) el.innerHTML = html || "No withdrawals";
  });
}

function loadGiftHistory(phone) {
  onValue(ref(db, "gift_history/" + phone), snap => {
    const el = document.getElementById("giftHistory");
    if (!el) return;

    if (!snap.exists()) {
      el.innerHTML = `<p class="small">No gift history yet.</p>`;
      return;
    }

    const data = snap.val();
    const sentGifts = data.sent ? Object.values(data.sent) : [];
    const receivedGifts = data.received ? Object.values(data.received) : [];

    let html = `<h4 style="color:#dfb72c; margin-bottom:8px; font-size:13px;">🎁 Received Gifts</h4>`;
    if (receivedGifts.length > 0) {
      receivedGifts.sort((a, b) => b.timestamp - a.timestamp);
      receivedGifts.forEach(g => {
        const date = new Date(g.timestamp).toLocaleString();
        html += `<div class="small" style="border-bottom:1px solid rgba(223, 183, 44, 0.2); padding:6px 0;">
          Received <span class="number">+${g.amount} Temple_DA</span> from <b>@${g.senderName}</b> (${maskPhone(g.senderPhone)})<br>
          <span style="color:#888;">${date}</span>
        </div>`;
      });
    } else {
      html += `<p class="small" style="margin-bottom:10px;">No gifts received yet.</p>`;
    }

    html += `<h4 style="color:#dfb72c; margin:14px 0 8px 0; font-size:13px;">📤 Sent Gifts</h4>`;
    if (sentGifts.length > 0) {
      sentGifts.sort((a, b) => b.timestamp - a.timestamp);
      sentGifts.forEach(g => {
        const date = new Date(g.timestamp).toLocaleString();
        html += `<div class="small" style="border-bottom:1px solid rgba(223, 183, 44, 0.2); padding:6px 0;">
          Sent <span class="number">-${g.amount} Temple_DA</span> to <b>@${g.recipientName}</b> (${maskPhone(g.recipientPhone)})<br>
          <span style="color:#888;">${date}</span>
        </div>`;
      });
    } else {
      html += `<p class="small">No gifts sent yet.</p>`;
    }

    el.innerHTML = html;
  });
}
