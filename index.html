window.registerUser = async () => {
  const name = v("name");
  const phone = v("phone");
  const wallet = v("wallet");
  const password = v("password");
  const referrer = v("ref");

  if (!walletRegex.test(wallet)) return alert("Invalid BEP20 wallet");
  const usersSnap = await get(ref(db, "users"));
  let walletExists = false;

  usersSnap.forEach(s => {
    if (s.val().wallet === wallet) {
      walletExists = true;
    }
  });

  if (walletExists) return alert("This wallet is already registered");

  const userSnap = await get(ref(db, "users/" + phone));
  if (userSnap.exists()) return alert("User exists");

  await set(ref(db, "users/" + phone), {
    name,
    wallet,
    password: btoa(password),
    balance: 6,
    investment: 0,
    locked: 0,
    lockDate: 0,
    referrer: referrer || "",
    createdAt: Date.now(),
    tier: "none",
    points: 0,
    subscribersCount: 0
  });

  alert("Registration successful");
  location.hash = "#login";
};

window.login = async () => {
  const phone = v("phone");
  const pass = v("password");

  if (phone.includes("@")) {
    try {
      const userCredential = await signInWithEmailAndPassword(auth, phone, pass);
      const user = userCredential.user;

      const adminSnap = await get(ref(db, "admins/" + user.uid));
      
      if (adminSnap.exists()) {
        localStorage.setItem("admin", "1");
        location.hash = "#admin";
        alert("Admin Login Successful!");
      } else {
        alert("Aap authenticated hain par Admin list mein nahi hain.");
      }
    } catch (error) {
      alert("Admin Login Failed: " + error.message);
    }
    return;
  }

  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return alert("User not found");

  const user = snap.val();
  if (atob(user.password) !== pass) return alert("Wrong password");

  localStorage.setItem("user", phone);
  location.hash = "#user";
};

/* Reel / Talent Publishing With Direct File Upload */
window.publishTalent = async () => {
  try {
    const phone = localStorage.getItem("user");
    if (!phone) return alert("Please login first");

    const typeEl = document.getElementById("talentType");
    const titleEl = document.getElementById("talentTitle");
    const mediaEl = document.getElementById("talentMedia");
    const descEl = document.getElementById("talentText");
    const fileInput = document.getElementById("talentFile");

    const type = typeEl ? typeEl.value : "video";
    const title = titleEl ? titleEl.value.trim() : "";
    let mediaUrl = mediaEl ? mediaEl.value.trim() : "";
    const description = descEl ? descEl.value.trim() : "";
    const file = fileInput && fileInput.files ? fileInput.files[0] : null;

    if (!title) return alert("Kripya title ya caption zaroor daalein!");

    let storagePath = "";

    // Agar device se reel/video upload ho rahi hai
    if (file) {
      if (file.size > 50 * 1024 * 1024) {
        return alert("Video/File size 50MB se chhota hona chahiye!");
      }

      const publishBtn = document.getElementById("publishBtn");
      const progressContainer = document.getElementById("uploadProgressContainer");
      const progressBar = document.getElementById("uploadProgressBar");
      const statusText = document.getElementById("uploadStatusText");

      if (publishBtn) publishBtn.disabled = true;
      if (progressContainer) progressContainer.style.display = "block";

      const cleanFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
      storagePath = `posts/${phone}_${Date.now()}_${cleanFileName}`;
      const fileRef = sRef(storage, storagePath);
      const uploadTask = uploadBytesResumable(fileRef, file);

      await new Promise((resolve, reject) => {
        uploadTask.on(
          "state_changed",
          snapshot => {
            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
            if (progressBar) progressBar.style.width = progress + "%";
            if (statusText) statusText.innerText = `Uploading Reel: ${Math.round(progress)}%`;
          },
          error => {
            if (publishBtn) publishBtn.disabled = false;
            if (progressContainer) progressContainer.style.display = "none";
            reject(error);
          },
          async () => {
            mediaUrl = await getDownloadURL(uploadTask.snapshot.ref);
            resolve();
          }
        );
      });
    }

    if (type !== "text" && !mediaUrl) {
      return alert("Kripya video file select karein ya online media URL daalein!");
    }

    const userSnap = await get(ref(db, "users/" + phone));
    const u = userSnap.exists() ? userSnap.val() : {};

    const newPostRef = push(ref(db, "posts"));
    await set(newPostRef, {
      authorPhone: phone,
      authorName: u.name || "Creator",
      type: type,
      title: title,
      mediaUrl: mediaUrl || "",
      storagePath: storagePath || "",
      description: description || "",
      likesCount: 0,
      createdAt: Date.now()
    });

    alert("Reel / Post successfully published!");
    location.hash = "#feed";
  } catch (error) {
    console.error("Publish error:", error);
    alert("Publish karne me error aaya: " + error.message);
  }
};

/* Delete Reel / Post Function */
window.deleteMyPost = async (postId, storagePath) => {
  const phone = localStorage.getItem("user");
  const isAdmin = localStorage.getItem("admin");

  if (!phone && !isAdmin) return alert("Please login first");

  const confirmDelete = confirm("Kya aap sach me is video/reel ko delete karna chahte hain?");
  if (!confirmDelete) return;

  try {
    const postSnap = await get(ref(db, "posts/" + postId));
    if (!postSnap.exists()) return alert("Post already deleted");

    const p = postSnap.val();
    if (p.authorPhone !== phone && !isAdmin) {
      return alert("Aap sirf apni hi uploaded video/reel delete kar sakte hain!");
    }

    // 1. Firebase Storage se video file delete karein (agar uploaded thi)
    if (storagePath) {
      try {
        const fileRef = sRef(storage, storagePath);
        await deleteObject(fileRef);
      } catch (err) {
        console.warn("Storage delete notice:", err);
      }
    }

    // 2. Database se post aur likes record hatayein
    await remove(ref(db, "posts/" + postId));
    await remove(ref(db, "likes/" + postId));

    alert("Reel / Video successfully deleted!");
  } catch (err) {
    console.error("Delete error:", err);
    alert("Delete karne me dikkat aayi: " + err.message);
  }
};

window.withdraw = async () => {
  const phone = localStorage.getItem("user");
  const amount = parseFloat(v("withdraw"));

  if (!amount || amount <= 0) return alert("Invalid amount");

  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return alert("User not found");
  const u = snap.val();

  if ((u.investment || 0) <= 0) return alert("Withdrawal not allowed without investment");

  let dailyLimit = 1000;
  const userInvestment = u.investment || 0;

  if (userInvestment >= 1 && userInvestment < 20) {
    dailyLimit = 60;
  }

  if (amount > dailyLimit) {
    return alert(`Aapke current investment (${userInvestment} USDT) ke anusar aap ek baar mein maximum ${dailyLimit} Temple_DA hi withdraw kar sakte hain.`);
  }

  const pending = await get(ref(db, "withdrawals/pending/" + phone));
  if (pending.exists()) {
    return alert("Aapka pichla withdrawal request abhi pending hai.");
  }

  if (amount > u.balance) return alert("Insufficient balance");

  const historySnap = await get(ref(db, "withdrawals/history/" + phone));
  let totalWithdrawnIn24Hours = 0;
  const twentyFourHoursAgo = Date.now() - (24 * 60 * 60 * 1000);

  if (historySnap.exists()) {
    historySnap.forEach(child => {
      const record = child.val();
      if (record.time && record.time > twentyFourHoursAgo) {
        totalWithdrawnIn24Hours += parseFloat(record.amount || 0);
      }
    });
  }

  if (totalWithdrawnIn24Hours + amount > dailyLimit) {
    const bachaHuaLimit = dailyLimit - totalWithdrawnIn24Hours;
    return alert(`Daily Limit Exceeded! Aaj aap maximum ${bachaHuaLimit.toFixed(2)} Temple_DA aur withdraw kar sakte hain.`);
  }

  await set(ref(db, "withdrawals/pending/" + phone), {
    amount,
    wallet: u.wallet,
    timestamp: Date.now()
  });

  alert("Withdrawal request successfully submitted for approval!");
};

    <div class="card">
    <h2>Admin Dashboard</h2>
    <input id="price" placeholder="Update Temple_DA price">
    <button onclick="updatePrice()">Update Price</button>
    <button onclick="adminLogout()">Admin Logout</button>
    </div>

    <div class="card">
    <h3>Users</h3>
    <table>
    <tr>
    <th>ID</th>

    <th>Investment</th>

    <th>Action</th>

    ${rows}
    </table>
    </div>

    <div class="card">

    <div id="pendingPackages"></div>

    <div class="card">
    <h3>Pending Investments</h3>
    <div id="pendingInvest"></div>

}

async function loadPendingPackages() {
  const snap = await get(ref(db, "packages/pending"));
  let html = "";

  for (const child of Object.entries(snap.val() || {})) {
    const phone = child[0];
    const d = child[1];

    html += `
    <div class="card">
    <b>User:</b> ${phone}<br>
    <b>Package:</b> ${d.tier.toUpperCase()}<br>
    <b>Amount:</b> ${d.amountUSDT} USDT<br>
    <b>Wallet:</b> ${d.wallet}
    <br><br>
    <button onclick="approvePackage('${phone}','${d.tier}')">Approve Package</button>
    <button onclick="rejectPackage('${phone}')">Reject</button>
    </div>`;
  }

  const el = document.getElementById("pendingPackages");
  if (el) el.innerHTML = html || "No pending package requests";
}

window.approvePackage = async (phone, tier) => {
  await update(ref(db, "users/" + phone), { tier: tier });
  await remove(ref(db, "packages/pending/" + phone));
  alert(`Package ${tier.toUpperCase()} approved!`);
  loadPendingPackages();
};

window.rejectPackage = async phone => {
  await remove(ref(db, "packages/pending/" + phone));
  alert("Package request rejected");
  loadPendingPackages();
};

async function loadPendingInvest() {
  const snap = await get(ref(db, "investments/pending"));
  let html = "";

  for (const child of Object.entries(snap.val() || {})) {
    const phone = child[0];
    const d = child[1];

    const userSnap = await get(ref(db, "users/" + phone));
    const user = userSnap.val();

    html += `
    <div class="card">

    <b>Wallet:</b> ${user ? user.wallet : ''}<br>
    <b>Amount:</b> ${d.amountUSDT} USDT

    <button onclick="approveInvest('${phone}')">Approve</button>
    <button onclick="rejectInvest('${phone}')">Reject</button>
    </div>`;
  }

}

async function loadPendingWithdraw() {
  const snap = await get(ref(db, "withdrawals/pending"));
  let html = "";

  snap.forEach(s => {
    const p = s.key;
    const d = s.val();

    html += `
    <div class="card">
    <b>User:</b> ${p}<br>
    <b>Amount:</b> ${d.amount} Temple_DA<br>
    <b>Wallet:</b> ${d.wallet}

window.approveInvest = async phone => {
  const snap = await get(ref(db, "investments/pending/" + phone));
  const d = snap.val();

  const userSnap = await get(ref(db, "users/" + phone));
  const u = userSnap.val();

  const currentPrice = await getPrice();
  const newTemple_DAAmount = Number((d.amountUSDT / currentPrice).toFixed(2));

  const newInvestment = (u.investment || 0) + d.amountUSDT;
  const newLocked = (u.locked || 0) + newTemple_DAAmount;

  await update(ref(db, "users/" + phone), {
    investment: newInvestment,
    locked: newLocked,
    lockDate: u.lockDate || Date.now()
  });

  await push(ref(db, "investments/history/" + phone), {
    amountUSDT: d.amountUSDT,
    temple_DAAmount: newTemple_DAAmount,
    type: "invest",
    time: Date.now()
  });

  await distributeReferral(phone, d.amountUSDT);

  const poolSnap = await get(ref(db, "liquidityPool"));
  const pool = (poolSnap.val() || 0) + d.amountUSDT;
  await set(ref(db, "liquidityPool"), pool);

  await remove(ref(db, "investments/pending/" + phone));
  alert("Investment approved!");
};

window.approveUpgrade = async phone => {
  const snap = await get(ref(db, "investments/upgrade/" + phone));
  if (!snap.exists()) return alert("Upgrade not found");

  const d = snap.val();
  const userSnap = await get(ref(db, "users/" + phone));
  const u = userSnap.val();

  const currentPrice = await getPrice();
  const newTemple_DAAmount = Number((d.amountUSDT / currentPrice).toFixed(2));

  if ((u.investment || 0) + d.amountUSDT > 250) {
    alert("Upgrade exceeds maximum limit");
    await remove(ref(db, "investments/upgrade/" + phone));
    return;
  }

  const newLocked = (u.locked || 0) + newTemple_DAAmount;

  await update(ref(db, "users/" + phone), {
    investment: (u.investment || 0) + d.amountUSDT,
    locked: newLocked,
    lockDate: Date.now()
  });

  await push(ref(db, "investments/history/" + phone), {
    amountUSDT: d.amountUSDT,
    temple_DAAmount: newTemple_DAAmount,
    type: "upgrade",
    time: Date.now()
  });

  await distributeReferral(phone, d.amountUSDT);
  await remove(ref(db, "investments/upgrade/" + phone));
  alert("Upgrade approved!");
};

window.rejectUpgrade = async phone => {
  await remove(ref(db, "investments/upgrade/" + phone));
  alert("Upgrade request rejected");
};

window.approveWithdraw = async phone => {
  const snap = await get(ref(db, "withdrawals/pending/" + phone));
  const d = snap.val();

  const userSnap = await get(ref(db, "users/" + phone));
  const u = userSnap.val();

  if (u.balance < d.amount) return alert("Insufficient balance");

  await update(ref(db, "users/" + phone), {
    balance: u.balance - d.amount
  });
  await push(ref(db, "withdrawals/history/" + phone), {
    amount: d.amount,
    wallet: d.wallet,
    time: Date.now()
  });

  await remove(ref(db, "withdrawals/pending/" + phone));
  alert("Withdrawal approved");
};

  const snap = await get(ref(db, "investments/upgrade"));
  let html = "";

  for (const child of Object.entries(snap.val() || {})) {
    const phone = child[0];
    const d = child[1];

    html += `

    <b>Wallet:</b> ${d.wallet}<br>

    </div>`;

}

async function distributeReferral(phone, amount) {
  const levels = [10, 5, 2.5, 1, 1, 1, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1];
  let current = phone;
  const price = await getPrice();
  const tmpl = amount / price;

  for (let i = 0; i < 15; i++) {
    const s = await get(ref(db, "users/" + current));
    if (!s.exists()) break;

    const userData = s.val();
    const referrer = userData.referrer;
    if (!referrer) break;

    const rSnap = await get(ref(db, "users/" + referrer));
    if (!rSnap.exists()) break;
    const r = rSnap.val();

    if (i >= 1 && (r.investment || 0) < 20) {
      current = referrer;
      continue;
    }

    const bonus = tmpl * (levels[i] / 100);

    await update(ref(db, "users/" + referrer), {
      balance: Number((r.balance + bonus).toFixed(2))
    });

    current = referrer;
  }
}

function autoRelease(phone, u) {
  if (!u.lockDate || !u.locked || u.locked <= 0) return;

  const days = (Date.now() - u.lockDate) / (1000 * 60 * 60 * 24);

  if (days >= 30) {
    const cycles = Math.floor(days / 30);
    if (cycles < 1) return;

    let totalRelease = 0;
    let currentLocked = u.locked;

    for (let i = 0; i < cycles; i++) {
      const release = currentLocked * 0.05;
      totalRelease += release;
      currentLocked -= release;
      if (currentLocked < 0) {
        currentLocked = 0;
        break;
      }
    }

    const newBalance = Number(((u.balance || 0) + totalRelease).toFixed(2));
    const newLocked = Number(currentLocked.toFixed(2));

    const updates = {
      balance: newBalance,
      locked: newLocked,
      lockDate: Date.now()
    };

    if (newLocked <= 0) {
      updates.investment = 0;
      updates.lockDate = 0;
    }

    update(ref(db, "users/" + phone), updates).catch(err => console.error("Update error: ", err));
  }
}

window.releaseLocked = async phone => {
  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return alert("User not found");

  const u = snap.val();
  if (!u.locked || u.locked <= 0) return alert("No locked tokens to release");

  const releasedAmount = u.locked;

  await update(ref(db, "users/" + phone), {
    balance: (u.balance || 0) + releasedAmount,
    locked: 0,
    lockDate: 0,
    investment: 0
  });

  alert("Full cycle completed. User can invest again.");
};

async function getPrice() {
  const s = await get(ref(db, "config/temple_DAPrice"));
  return s.exists() ? s.val() : 0.0002;
}

window.updatePrice = async () => {
  const p = parseFloat(v("price"));
  await set(ref(db, "config/temple_DAPrice"), p);
  alert("Price updated");
};

window.editUser = async oldId => {
  const newId = prompt("Enter new user ID");
  if (!newId) return;

  const snap = await get(ref(db, "users/" + oldId));
  if (!snap.exists()) return alert("User not found");

  const data = snap.val();
  await set(ref(db, "users/" + newId), data);
  await remove(ref(db, "users/" + oldId));
  alert("User ID updated");
};

window.deleteUser = async id => {
  await remove(ref(db, "users/" + id));
};

window.logout = () => {
  localStorage.removeItem("user");
  location.hash = "#login";
};

window.adminLogout = () => {
  localStorage.removeItem("admin");
  location.hash = "#login";
};

function loadInvestHistory(phone) {
  onValue(ref(db, "investments/history/" + phone), snap => {
    let list = [];
    snap.forEach(s => {
      const d = s.val();
      if (!d.type || d.type === "invest") list.push(d);
    });

    list = list.reverse().slice(0, 25);
    let html = "";
    list.forEach(d => {
      const date = new Date(d.time).toLocaleDateString();
      html += `<div class="small">${date} → ${d.amountUSDT} USDT</div>`;
    });

    document.getElementById("investHistory").innerHTML = html || "No investment yet";
  });
}

function loadWithdrawHistory(phone) {
  onValue(ref(db, "withdrawals/history/" + phone), snap => {
    let list = [];
    snap.forEach(s => {
      list.push(s.val());
    });

    list = list.reverse().slice(0, 25);
    let html = "";

    });

      html += `<div class="small">${date} → Upgrade ${d.amountUSDT} USDT</div>`;
    });

function v(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function appDiv() {
  return document.getElementById("app");
}
