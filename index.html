<!DOCTYPE html>
<html lang="en">
<head>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(circle at top, #141204 0%, #080808 100%);
  color: #f0f0f0;
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px;
  letter-spacing: 0.5px;
  min-height: 100vh;
  overflow-x: hidden;
}
nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 30px; background: rgba(10, 10, 10, 0.95);
  backdrop-filter: blur(12px); border-bottom: 2px solid #dfb72c;
  position: sticky; top: 0; z-index: 1000;
}
nav div:first-child { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 19px; display: flex; align-items: center; }
nav a { color: #fff; text-decoration: none; margin-left: 12px; font-weight: 700; text-transform: uppercase; font-size: 13px; padding: 6px 10px; border-radius: 6px; transition: all 0.3s; }
nav a:hover { color: #dfb72c; background: rgba(223, 183, 44, 0.12); }
.container { max-width: 1050px; margin: 25px auto; padding: 15px; }
.card { background: rgba(20, 20, 20, 0.65); border: 1px solid rgba(223, 183, 44, 0.25); padding: 24px; border-radius: 14px; margin-bottom: 20px; backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
.card:hover { border-color: rgba(223, 183, 44, 0.5); }
h2, h3 { font-family: 'Orbitron', sans-serif; color: #dfb72c; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
h2 { font-size: 22px; border-bottom: 1px solid rgba(223, 183, 44, 0.2); padding-bottom: 8px; }
h3 { font-size: 17px; }
input, select, textarea { background: #0d0d0d; color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 15px; border: 1px solid rgba(223, 183, 44, 0.4); border-radius: 8px; padding: 11px 14px; width: 100%; margin: 8px 0; }
input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 12px rgba(223, 183, 44, 0.4); border-color: #dfb72c; background: #141414; }
button { background: linear-gradient(135deg, #b8860b 0%, #e6ca65 50%, #996515 100%); color: #000; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px; text-transform: uppercase; padding: 12px; border-radius: 8px; border: none; cursor: pointer; width: 100%; margin: 8px 0; box-shadow: 0 4px 15px rgba(184, 134, 11, 0.25); }
button:hover { transform: scale(1.01); background: linear-gradient(135deg, #dfb72c 0%, #fff 50%, #dfb72c 100%); }
.btn-secondary { background: transparent; border: 1px solid #dfb72c; color: #dfb72c; box-shadow: none; }
.btn-secondary:hover { background: rgba(223, 183, 44, 0.15); color: #fff; }
.btn-danger { background: linear-gradient(135deg, #cc0000 0%, #ff4444 100%); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 15px 0 20px 0; }
.grid .card { text-align: center; padding: 16px; font-size: 20px; font-weight: 700; margin-bottom: 0; }

table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font-size: 13px; }

.center { text-align: center; }
.small { font-size: 13px; color: #b5b5b5; margin-top: 3px; }
.number { color: #dfb72c; font-weight: bold; font-family: 'Orbitron', sans-serif; }
.badge-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-family: 'Orbitron', sans-serif; background: rgba(223, 183, 44, 0.2); color: #dfb72c; border: 1px solid #dfb72c; }

/* Accordion Histories */
.accordion-wrapper { background: rgba(18, 18, 18, 0.8); border: 1px solid rgba(223, 183, 44, 0.25); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
.accordion-header { padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: rgba(25, 25, 25, 0.6); font-weight: 700; font-family: 'Orbitron', sans-serif; font-size: 14px; color: #dfb72c; }
.accordion-header:hover { background: rgba(223, 183, 44, 0.1); }
.accordion-content { display: none; padding: 15px; background: rgba(10, 10, 10, 0.7); border-top: 1px solid rgba(223, 183, 44, 0.15); max-height: 380px; overflow-y: auto; }
.accordion-wrapper.active .accordion-content { display: block; }

/* Reels Feed CSS */
.reels-page-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #000; padding: 10px; position: fixed; top: 0; left: 0; width: 100%; z-index: 2000; }
.reels-top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 400px; margin-bottom: 8px; }
.reels-viewport { width: 100%; max-width: 400px; height: 80vh; max-height: 720px; overflow-y: scroll; scroll-snap-type: y mandatory; border-radius: 16px; border: 2px solid rgba(223, 183, 44, 0.4); background: #000; position: relative; scrollbar-width: none; }
.reels-viewport::-webkit-scrollbar { display: none; }
.reel-item { position: relative; width: 100%; height: 100%; scroll-snap-align: start; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.reel-item video, .reel-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
.reel-overlay-bottom { position: absolute; bottom: 20px; left: 15px; right: 80px; z-index: 10; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
.reel-actions-bar { position: absolute; bottom: 30px; right: 12px; z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 15px; }
.reel-circle-btn { background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(223, 183, 44, 0.5); color: #fff; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }
.reel-circle-label { font-size: 11px; font-weight: bold; margin-top: 3px; font-family: 'Orbitron', sans-serif; color: #fff; text-align: center; }

/* Comment Drawer */
.chat-drawer { position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); width: 100%; max-width: 440px; height: 70vh; background: rgba(14, 14, 14, 0.98); border-top: 2px solid #dfb72c; border-radius: 20px 20px 0 0; z-index: 3000; transition: bottom 0.35s cubic-bezier(0.1, 0.9, 0.2, 1); padding: 16px; display: flex; flex-direction: column; }
.chat-drawer.open { bottom: 0; }
.chat-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(223, 183, 44, 0.3); padding-bottom: 10px; }
.chat-box { flex: 1; overflow-y: auto; padding: 10px 0; margin-top: 8px; }
.chat-msg { background: rgba(255, 255, 255, 0.05); border-left: 3px solid #dfb72c; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; }
</style>
</head>

<body>

<nav id="mainNavbar">
<div><span style="color: #ffd700; font-size: 18px; font-weight: bold;">Temple_DA</span></div>

<script type="module">

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const storage = getStorage(app);

let activePostIdForComments = null;

function maskPhone(p) { return p && p.length > 4 ? "******" + p.slice(-4) : "Creator"; }
function getPackageDurationMs(tier) { return tier === "yearly" ? 365*24*60*60*1000 : 30*24*60*60*1000; }
function checkAndHandlePackageExpiry(phone, u) {
  if (!u.tier || u.tier === "none" || !u.packageExpiresAt) return u.tier || "none";
  if (Date.now() > u.packageExpiresAt) {
    update(ref(db, "users/" + phone), { tier: "none", packagePriceUSDT: 0, packageExpired: true });
    return "none";
  }
  return u.tier;
}

window.toggleAccordion = (id) => { document.getElementById(id)?.classList.toggle("active"); };

const routes = {
  "#": landing,
  "#login": loginPage,
  "#user": userDashboard,
  "#admin": adminDashboard,
  "#feed": feedPage,
  "#packages": packagesPage
};

window.addEventListener("hashchange", router);
router();

function router() {
  const hash = location.hash.split("?")[0] || "#";
  const navBar = document.getElementById("mainNavbar");
  if (navBar) navBar.style.display = (hash === "#feed") ? "none" : "flex";
  (routes[hash] || landing)();
}

async function getLivePriceData() {
  try {
    const res = await fetch("https://api.dexscreener.com/latest/dex/pairs/bsc/0x707171A0C27f87B8C530B20831f7B004e6647830");
    const data = await res.json();
    if (data && data.pair && data.pair.priceUsd) return parseFloat(data.pair.priceUsd);
  } catch (err) {}
  const s = await get(ref(db, "config/temple_DAPrice"));
  return s.exists() ? s.val() : 0.0002;
}
async function getPrice() { return await getLivePriceData(); }

async function landing() {
  const price = await getLivePriceData();
  appDiv().innerHTML = `
    <div class="card center">
      <h2>Temple Digital Asset Ecosystem</h2>
      <p>Live Price: <span class="number">$${price.toFixed(4)}</span></p>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:15px;">
        <a href="#login"><button style="width:180px; background:#dfb72c; color:#000;">⚡ Connect & Auto-Login</button></a>
        <a href="#feed"><button style="width:160px; background:transparent; border:1px solid #dfb72c; color:#dfb72c;">⚡ Watch Reels</button></a>
      </div>
    </div>`;
}

function loginPage() {
  appDiv().innerHTML = `
  <div class="card center">
    <h2>Web3 Instant Access</h2>
    <p class="small" style="margin-bottom:15px;">Automatically connect your wallet to login or register instantly with 6 Temple_DA bonus.</p>
    <button onclick="loginWithWallet()" style="background: linear-gradient(135deg, #00ff88 0%, #00aa55 100%); color:#000; padding:15px; font-size:15px;">⚡ Connect Wallet & Auto-Login</button>
    <div style="margin-top:15px;"><a href="#login" onclick="adminLoginPrompt()" style="color:#dfb72c; font-size:12px;">Admin Login Access</a></div>
  </div>`;
}

window.loginWithWallet = async () => {
  if (typeof window.ethereum === 'undefined') return alert("MetaMask or Trust Wallet not detected!");
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const userWallet = accounts[0].toLowerCase();
    const indexSnap = await get(ref(db, "wallet_index/" + userWallet));
    let phone = "";

    if (indexSnap.exists()) {
      phone = indexSnap.val();
    } else {
      phone = "u_" + userWallet.slice(-6);
      await set(ref(db, "users/" + phone), {
        name: "Web3 Holder", phone: phone, wallet: accounts[0], balance: 6, investment: 0, locked: 0, tier: "none", points: 0, elite21: false, monthlyBusiness: 0
      });
      await set(ref(db, "wallet_index/" + userWallet), phone);
      alert("Account automatically created with 6 Temple_DA welcome bonus!");
    }
    localStorage.setItem("user", phone);
    alert("Login Successful!");
    location.hash = "#user";
  } catch (err) { alert("Login failed: " + err.message); }
};

window.adminLoginPrompt = async () => {
  const email = prompt("Enter Admin Email:");
  const pass = prompt("Enter Admin Password:");
  if (!email || !pass) return;
  try {
    const uc = await signInWithEmailAndPassword(auth, email, pass);
    if ((await get(ref(db, "admins/" + uc.user.uid))).exists()) {
      localStorage.setItem("admin", "1"); location.hash = "#admin"; alert("Admin Login Successful!");
    } else { alert("Not authorized as admin."); }
  } catch (err) { alert("Admin login error: " + err.message); }
};

/* =========================================================================
   REELS FEED
========================================================================= */
function feedPage() {
  const currentUser = localStorage.getItem("user") || "";
  appDiv().innerHTML = `
    <div class="reels-page-wrapper">
      <div class="reels-top-bar">
        <a href="#user"><button class="btn-secondary" style="width:auto; padding:6px 12px; margin:0; font-size:12px;">← Dashboard</button></a>
      </div>
      <div class="reels-viewport" id="reelsViewport">Loading reels...</div>
    </div>`;

  onValue(ref(db, "posts"), snap => {
    const listEl = document.getElementById("reelsViewport");
    if (!listEl) return;
    if (!snap.exists()) { listEl.innerHTML = `<p class="center" style="color:#fff; padding:20px;">No reels yet.</p>`; return; }
    let posts = [];
    snap.forEach(child => posts.push({ id: child.key, ...child.val() }));
    posts.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

    let html = "";
    posts.forEach(p => {
      const isMy = currentUser && currentUser === p.authorPhone;
      let media = p.type === "video" ? `<video loop playsinline autoplay muted src="${p.mediaUrl}"></video>` : `<img src="${p.mediaUrl}">`;
      html += `
        <div class="reel-item">
          ${media}
          <div class="reel-overlay-bottom">
            <strong style="color:#dfb72c;">@${p.authorName || 'Creator'}</strong>
            <p style="font-weight:bold; font-size:13px; margin-top:3px; color:#fff;">${p.title}</p>
          </div>
          <div class="reel-actions-bar">
            <div style="text-align:center;"><button class="reel-circle-btn" onclick="likePost('${p.id}')">❤️</button><div class="reel-circle-label">${p.likesCount || 0}</div></div>
            <div style="text-align:center;"><button class="reel-circle-btn" onclick="openCommentsModal('${p.id}', '${encodeURIComponent(p.title)}')">💬</button><div class="reel-circle-label">Msg</div></div>
            ${isMy ? `<div style="text-align:center;"><button class="reel-circle-btn" style="border-color:#ff4444;" onclick="deleteMyPost('${p.id}', '${p.storagePath||''}')">🗑️</button><div class="reel-circle-label" style="color:#ff4444;">Del</div></div>` : ''}
          </div>
        </div>`;
    });
    listEl.innerHTML = html;
  });
}

window.likePost = async (postId) => {
  const user = localStorage.getItem("user");
  if (!user) return alert("Please login");
  const postSnap = await get(ref(db, `posts/${postId}`));
  if (!postSnap.exists()) return;
  const p = postSnap.val();
  if (p.authorPhone === user) return alert("Cannot like your own post");
  
  const chk = await get(ref(db, `likes/${postId}/${user}`));
  if (chk.exists()) return alert("Already liked!");
  
  await set(ref(db, `likes/${postId}/${user}`), true);
  await update(ref(db, `posts/${postId}`), { likesCount: Number(p.likesCount || 0) + 1 });
  alert("Liked successfully!");
};

window.openCommentsModal = (postId, title) => {
  activePostIdForComments = postId;
  document.getElementById("chatReelTitle").innerText = decodeURIComponent(title);
  document.getElementById("commentModal").classList.add("open");
  onValue(ref(db, `post_comments/${postId}`), snap => {
    let html = "";
    if (!snap.exists()) { document.getElementById("commentsList").innerHTML = `<p class="small center">No messages.</p>`; return; }
    snap.forEach(c => { const m = c.val(); html += `<div class="chat-msg"><b>${m.senderName}</b>: ${m.message}</div>`; });
    document.getElementById("commentsList").innerHTML = html;
  });
};
window.closeCommentsModal = () => { document.getElementById("commentModal").classList.remove("open"); activePostIdForComments = null; };
window.submitReelComment = async () => {
  const user = localStorage.getItem("user");
  if (!user || !activePostIdForComments) return;
  const input = document.getElementById("chatInput");
  if (!input.value.trim()) return;
  await push(ref(db, `post_comments/${activePostIdForComments}`), { senderPhone: user, senderName: "Holder", message: input.value.trim(), time: Date.now() });
  input.value = "";
};

window.deleteMyPost = async (postId, path) => {
  if (!confirm("Delete post?")) return;
  if (path) { try { await deleteObject(sRef(storage, path)); } catch(e){} }
  await remove(ref(db, `posts/${postId}`));
  alert("Deleted!");
};

    </div>

      <button onclick="convertPts()" style="background:#00ff88; color:#000;">Convert Points</button>
    </div>

    <!-- DEPOSIT -->
    <div class="card" style="border:1px solid #00ff88; background:rgba(0,255,136,0.03);">

      <div class="accordion-content" id="myUploadedPosts">Loading...</div>
    </div>

    <div class="card center" style="margin-top:20px;"><button onclick="logout()">Logout</button></div>`;

    loadMyPosts(phone);

window.joinElite21 = async () => {
  const phone = localStorage.getItem("user");
  const u = (await get(ref(db, "users/" + phone))).val();
  await set(ref(db, "elite21/pending/" + phone), { name: u.name || "Member", wallet: u.wallet, amountUSDT: 250, timestamp: Date.now() });
  alert("Elite 21 join request submitted!");
};

window.publishTalent = async () => {
  const phone = localStorage.getItem("user");
  const title = v("talentTitle");
  const file = document.getElementById("talentFile").files[0];
  let mediaUrl = v("talentMedia");
  if (!title) return alert("Enter title");

  let path = "";
  if (file) {
    path = `posts/${phone}_${Date.now()}_${file.name}`;
    const task = uploadBytesResumable(sRef(storage, path), file);
    await new Promise((res, rej) => task.on("state_changed", null, rej, async () => { mediaUrl = await getDownloadURL(task.snapshot.ref); res(); }));
  }
  if (!mediaUrl) return alert("Provide video file or URL");

  await push(ref(db, "posts"), { authorPhone: phone, authorName: "Holder", type: "video", title, mediaUrl, storagePath: path, likesCount: 0, createdAt: Date.now() });
  alert("Published successfully!");
  location.hash = "#feed";
};

window.convertPts = async () => {
  const phone = localStorage.getItem("user");
  const u = (await get(ref(db, "users/" + phone))).val();
  const pts = Number(u.points || 0);
  if (pts < 100) return alert("Min 100 points required");
  const tda = pts / 10;
  await update(ref(db, "users/" + phone), { points: 0, balance: Number((u.balance + tda).toFixed(2)) });
  alert(`Converted ${pts} points to ${tda} Temple_DA!`);
};

window.makeDirectUSDTDeposit = async () => {
  const phone = localStorage.getItem("user");
  const amount = parseFloat(v("invest"));
  if (!amount || amount < 1 || amount > 250) return alert("Enter 1-250 USDT");
  const u = (await get(ref(db, "users/" + phone))).val();

  if (typeof window.ethereum === 'undefined') return alert("MetaMask not found!");
  try {
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    const provider = new ethers.providers.Web3Provider(window.ethereum);
    const signer = provider.getSigner();
    const contract = new ethers.Contract("0x55d398326f99059fF775485246999027B3197955", ["function transfer(address to, uint256 value) public returns (bool)"], signer);
    
    const tx = await contract.transfer("0x2760f05248a8377d3fdD86b80A3D48B010d5De95", ethers.utils.parseUnits(amount.toString(), 18));
    await tx.wait();

    const price = await getPrice();
    const tda = Number((amount / price).toFixed(2));
    await update(ref(db, "users/" + phone), {
      investment: (u.investment || 0) + amount, locked: (u.locked || 0) + tda, monthlyBusiness: (u.monthlyBusiness || 0) + amount, lockDate: u.lockDate || Date.now()
    });
    alert("Deposit Successful & Investment Active!");
  } catch (err) { alert("Deposit failed: " + err.message); }
};

window.withdraw = async () => {
  const phone = localStorage.getItem("user");
  const amount = parseFloat(v("withdraw"));
  if (!amount || amount <= 0) return alert("Invalid amount");
  const u = (await get(ref(db, "users/" + phone))).val();
  if ((u.investment || 0) <= 0) return alert("Investment required");
  if (amount > u.balance) return alert("Insufficient balance");

  await update(ref(db, "users/" + phone), { balance: Number((u.balance - amount).toFixed(2)) });
  await set(ref(db, "withdrawals/pending/" + phone), { amount, wallet: u.wallet || "N/A", timestamp: Date.now() });
  alert("Withdrawal request submitted!");
};

function loadMyPosts(phone) {
  onValue(ref(db, "posts"), snap => {
    let html = "";
    snap.forEach(c => { const p = c.val(); if (p.authorPhone === phone) html += `<div class="small"><b>${p.title}</b> (Likes: ${p.likesCount||0})</div>`; });
    const el = document.getElementById("myUploadedPosts");
    if (el) el.innerHTML = html || "No posts yet.";
  });
}

/* =========================================================================
   ADMIN DASHBOARD
========================================================================= */
async function adminDashboard() {
  if (!localStorage.getItem("admin")) return location.hash = "#login";
  appDiv().innerHTML = `
    <div class="card"><h2>Admin Dashboard</h2><button onclick="adminLogout()">Logout</button></div>
    <div class="card"><h3 style="color:#dfb72c;">⭐ Pending Elite 21 Requests</h3><div id="pendingElite21"></div></div>
    <div class="card"><h3 style="color:#00ff88;">Pending Withdrawals</h3><div id="pendingWithdraw"></div></div>`;
  loadAdminPending();
}

async function loadAdminPending() {
  const elE = document.getElementById("pendingElite21");
  const snapE = await get(ref(db, "elite21/pending"));
  let htmlE = "";
  snapE.forEach(s => { const p=s.key; const d=s.val(); htmlE += `<div class="card"><b>${p}</b> (${d.name})<br><button onclick="approveElite('${p}')">Approve Elite</button></div>`; });
  if (elE) elE.innerHTML = htmlE || "No pending";

  const elW = document.getElementById("pendingWithdraw");
  const snapW = await get(ref(db, "withdrawals/pending"));
  let htmlW = "";
  snapW.forEach(s => { const p=s.key; const d=s.val(); htmlW += `<div class="card"><b>${p}</b> | Amt: ${d.amount} TDA<br>Wallet: ${d.wallet}<br><button onclick="approveW('${p}')">Approve</button><button onclick="rejectW('${p}', ${d.amount})" class="btn-danger">Reject & Refund</button></div>`; });
  if (elW) elW.innerHTML = htmlW || "No pending";
}

window.approveElite = async (phone) => {
  await update(ref(db, "users/" + phone), { elite21: true });
  await remove(ref(db, "elite21/pending/" + phone));
  alert("Approved Elite!"); adminDashboard();
};
window.approveW = async (phone) => { await remove(ref(db, "withdrawals/pending/" + phone)); alert("Approved!"); adminDashboard(); };
window.rejectW = async (phone, amt) => {
  const u = (await get(ref(db, "users/" + phone))).val();
  await update(ref(db, "users/" + phone), { balance: Number(((u.balance||0)+amt).toFixed(2)) });
  await remove(ref(db, "withdrawals/pending/" + phone));
  alert("Rejected & Refunded!"); adminDashboard();
};

window.logout = () => { localStorage.removeItem("user"); location.hash = "#login"; };
window.adminLogout = () => { localStorage.removeItem("admin"); location.hash = "#login"; };
function v(id) { return document.getElementById(id)?.value.trim() || ""; }
function appDiv() { return document.getElementById("app"); }

</script>
