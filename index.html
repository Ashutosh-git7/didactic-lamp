/* Auto-Mode Reinvestment Wheel Animation */

  <div style="background:#181818; padding:26px; border:2px solid #dfb72c; border-radius:16px; max-width:400px; width: 90%; text-align:center; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">

<!-- Custom Prompt Modal (Replaces native prompt) -->
<div id="customPromptOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; justify-content:center; align-items:center;">
  <div style="background:#181818; padding:26px; border:2px solid #dfb72c; border-radius:16px; max-width:400px; width: 90%; text-align:center; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">

      <button onclick="executeCustomPrompt()" style="background: linear-gradient(135deg, #00ff88 0%, #00aa55 100%); color:#000; padding:11px 22px; width:auto; border-radius: 8px;">Submit</button>
      <button onclick="closeCustomPrompt()" style="background: linear-gradient(135deg, #cc0000 0%, #ff4444 100%); color:#fff; padding:11px 22px; width:auto; border-radius: 8px;">Cancel</button>

<script>
  window.customAlert = (msg) => {
    const el = document.getElementById('customAlertMessage');
    if (el) el.innerText = msg;
    const overlay = document.getElementById('customAlertOverlay');
    if (overlay) overlay.style.display = 'flex';
  };
  window.closeCustomAlert = () => {
    const overlay = document.getElementById('customAlertOverlay');
    if (overlay) overlay.style.display = 'none';
  };
  
  let confirmCallback = null;
  window.customConfirm = (msg, callback) => {
    const el = document.getElementById('customConfirmMessage');
    if (el) el.innerText = msg;
    confirmCallback = callback;
    const overlay = document.getElementById('customConfirmOverlay');
    if (overlay) overlay.style.display = 'flex';
  };
  window.executeCustomConfirm = () => {
    const overlay = document.getElementById('customConfirmOverlay');
    if (overlay) overlay.style.display = 'none';
    if(confirmCallback) confirmCallback();
  };
  window.closeCustomConfirm = () => {
    const overlay = document.getElementById('customConfirmOverlay');
    if (overlay) overlay.style.display = 'none';
    confirmCallback = null;
  };

  let promptCallback = null;
  window.customPrompt = (msg, callback) => {
    const el = document.getElementById('customPromptMessage');
    const inp = document.getElementById('customPromptInput');
    if (el) el.innerText = msg;
    if (inp) inp.value = '';
    promptCallback = callback;
    const overlay = document.getElementById('customPromptOverlay');
    if (overlay) overlay.style.display = 'flex';
  };
  window.executeCustomPrompt = () => {
    const overlay = document.getElementById('customPromptOverlay');
    const inp = document.getElementById('customPromptInput');
    const val = inp ? inp.value.trim() : '';
    if (overlay) overlay.style.display = 'none';
    if (promptCallback) promptCallback(val);
  };
  window.closeCustomPrompt = () => {
    const overlay = document.getElementById('customPromptOverlay');
    if (overlay) overlay.style.display = 'none';
    promptCallback = null;
  };

  window.showWeb3Toast = (text) => {

      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: BSC_HEX_CHAIN_ID }],

      }
    }
  }
}

function formatWeb3Error(err) {
  if (!err) return "Transaction failed.";
  if (err.message === "WEB3_NOT_FOUND") return "Web3 wallet not found.";
  if (err.code === 4001 || err.code === "ACTION_REJECTED" || err.message?.includes("rejected") || err.message?.includes("denied") || err.message?.includes("User rejected")) {
    return "Transaction was cancelled / rejected in your wallet.";
  }
  if (err.message?.includes("insufficient funds") || err.message?.includes("exceeds balance")) {
    return "Insufficient BNB in your wallet to cover network gas fees!";
  }
  return err.reason || err.data?.message || err.message || String(err);
}

async function executeUsdtTransfer(amount, descriptionLabel) {
  if (typeof window.ethereum === "undefined") {
    showWeb3NotDetectedModal();
    throw new Error("WEB3_NOT_FOUND");
  }

  showWeb3Toast("Requesting wallet connection...");
  let accounts;
  try {
    accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
  } catch (accErr) {
    hideWeb3Toast();
    throw new Error("Wallet connection request was cancelled.");
  }

  if (!accounts || accounts.length === 0) {
    hideWeb3Toast();
    throw new Error("No active wallet account found. Please unlock your wallet!");
  }
  const senderAddress = accounts[0];

  showWeb3Toast("Verifying BNB Smart Chain network...");
  await ensureBscNetwork();

  const provider = new ethers.providers.Web3Provider(window.ethereum, "any");
  const signer = provider.getSigner();

  const bnbBalance = await provider.getBalance(senderAddress);
  if (bnbBalance.isZero()) {
    hideWeb3Toast();
    throw new Error("Insufficient BNB in your wallet! You need a small amount of BNB to pay network gas fees.");
  }

  showWeb3Toast("Verifying USDT balance in your wallet...");
  const usdtContract = new ethers.Contract(OFFICIAL_USDT_CONTRACT, BEP20_ABI, signer);

  let decimals = 18;
  try { decimals = await usdtContract.decimals(); } catch (decErr) { decimals = 18; }

  const parsedAmount = ethers.utils.parseUnits(amount.toString(), decimals);
  const userUsdtBalance = await usdtContract.balanceOf(senderAddress);

  if (userUsdtBalance.lt(parsedAmount)) {
    hideWeb3Toast();
    const formattedBal = ethers.utils.formatUnits(userUsdtBalance, decimals);
    throw new Error(`Insufficient USDT balance!\nYou have ${parseFloat(formattedBal).toFixed(2)} USDT in your wallet, but ${amount} USDT is required.`);
  }

  showWeb3Toast("Wallet confirmation opening... Please approve!");
  let txObj = null;
  let txHash = null;

  try {
    txObj = await usdtContract.transfer(OFFICIAL_RECEIVER_ADDRESS, parsedAmount);
    txHash = txObj.hash;
  } catch (contractErr) {
    hideWeb3Toast();
    throw contractErr;
  }

  showWeb3Toast("Waiting for BNB Smart Chain confirmation...");
  let receipt = null;
  try {
    if (txObj && typeof txObj.wait === "function") {
      receipt = await txObj.wait(1);
    } else {
      receipt = await provider.waitForTransaction(txHash, 1, 60000);
    }
  } catch (waitErr) {
    hideWeb3Toast();
    throw new Error("Blockchain confirmation failed: " + (waitErr.reason || waitErr.message || waitErr));
  }

  hideWeb3Toast();
  if (!receipt || receipt.status !== 1) {
    throw new Error("Transaction failed or reverted on BNB Smart Chain! Payment was not received.");
  }

  return { tx: { hash: txHash }, senderAddress };
}

async function promoteNextInQueue(clubId) {
  if (clubId === 1) {
    return await promoteNextWaitingQueueMemberToClub1();
  }

  const qSnap = await get(ref(db, `cto_upgrade_queues/${clubId}`));
  if (!qSnap.exists()) return;

  let queueList = [];
  qSnap.forEach(child => { queueList.push({ key: child.key, ...child.val() }); });
  queueList.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
  if (queueList.length === 0) return;

  const candidate = queueList[0];
  const targetClubCfg = CTO_CLUBS_CONFIG.find(c => c.id === clubId);
  const slotsSnap = await get(ref(db, `cto_clubs/${clubId}/slots`));
  const currentSlots = Object.keys(slotsSnap.val() || {}).length;

  if (currentSlots < targetClubCfg.slotsMax) {
    await remove(ref(db, `cto_upgrade_queues/${clubId}/${candidate.key}`));

    const newSlotRef = push(ref(db, `cto_clubs/${clubId}/slots`));

      phone: candidate.phone, userName: candidate.userName || "Leader",
      earnedUSDT: 0, capUSDT: targetClubCfg.grossCap, status: "active", joinedAt: Date.now()
    });

    await update(ref(db, "users/" + candidate.phone), {
      ctoActiveClub: clubId, inHoldingQueueForClub: null, holdingQueueJoinedAt: 0
    });
  }
}

// 🟢 100% DECENTRALIZED WEB3 PRICE FETCH FROM PANCAKESWAP LIQUIDITY POOL
async function getPrice() {
  // 1. Firebase Admin Override Check (अगर एडमिन ने मैन्युअली प्राइस डाला है)
  try {
    const s = await get(ref(db, "config/temple_DAPrice"));
    if (s.exists() && parseFloat(s.val()) > 0) return parseFloat(s.val());
  } catch (e) {}

  // 2. Direct Web3 Fetch from PancakeSwap Pair Contract
  try {
    const PAIR_ABI = [
      "function getReserves() public view returns (uint112 _reserve0, uint112 _reserve1, uint32 _blockTimestampLast)",
      "function token0() public view returns (address)"
    ];
    
    // We use a robust public RPC node to avoid Binance CORS errors in browser
    // Using multiple fallback RPCs for stability
    const rpcUrls = [
      "https://binance.llamarpc.com",
      "https://bsc-dataseed.binance.org/",
      "https://bsc-dataseed1.defibit.io/"
    ];
    
    let priceUsdt = 0;
    
    for (const rpc of rpcUrls) {
        try {
            const provider = new ethers.providers.JsonRpcProvider(rpc);
            const pairContract = new ethers.Contract(LIQUIDITY_POOL_ADDRESS, PAIR_ABI, provider);
            
            const reserves = await pairContract.getReserves();
            const token0Address = await pairContract.token0();
            
            const reserve0 = parseFloat(ethers.utils.formatUnits(reserves._reserve0, 18)); 
            const reserve1 = parseFloat(ethers.utils.formatUnits(reserves._reserve1, 18)); 
            
            // Dynamically check which one is USDT to prevent inverted math
            if(token0Address.toLowerCase() === OFFICIAL_USDT_CONTRACT.toLowerCase()) {
                priceUsdt = reserve0 / reserve1; // USDT / Temple_DA
            } else {
                priceUsdt = reserve1 / reserve0; // USDT / Temple_DA
            }
            
            if (priceUsdt > 0) {
              console.log(`✅ Web3 Price Fetched via ${rpc}: $${priceUsdt.toFixed(6)}`);
              return priceUsdt;
            }
        } catch (rpcErr) {
            console.warn(`RPC ${rpc} failed, trying next...`);
        }
    }
  } catch (web3Err) {
    console.error("❌ Web3 Pool Fetch Failed completely", web3Err);
  }

  // 3. Fallback to DexScreener API if all RPCs are blocked by user's network
  try {
    const res = await fetch("https://api.dexscreener.com/latest/dex/pairs/bsc/0x707171A0C27f87B8C530B20831f7B004e6647830");
    const data = await res.json();
    if (data && data.pair && data.pair.priceUsd) {
      const apiPrice = parseFloat(data.pair.priceUsd);
      console.log(`✅ API Price Fetched Successfully: $${apiPrice.toFixed(6)}`);
      return apiPrice;
    }
  } catch(e) {
    console.error("❌ DexScreener API Fetch Failed:", e);
  }
  
  // Ultimate Fallback
  return 0.001569; 
}

window.login = async () => {
  const phone = v("phone");
  const pass = v("password");

  if (phone.includes("@")) {
    try {
      const userCredential = await signInWithEmailAndPassword(auth, phone, pass);
      const user = userCredential.user;
      const adminSnap = await get(ref(db, "admins/" + user.uid));

        customAlert("Admin Login Successful!");
      } else { customAlert("You are authenticated but not registered as an admin."); }

    return;

  const snap = await get(ref(db, "users/" + phone));

  setTimeout(() => { location.hash = "#user"; }, 500);
};

window.toggleVideoSound = (btnEl) => {
  const itemEl = btnEl.closest('.reel-item');
  if (!itemEl) return;
  const vid = itemEl.querySelector('video');
  if (!vid) return;
  vid.muted = !vid.muted;
  btnEl.innerText = vid.muted ? "🔇" : "🔊";
  btnEl.style.borderColor = vid.muted ? "rgba(223, 183, 44, 0.6)" : "#00ff88";
  if (vid.paused) vid.play().catch(() => {});
};
window.toggleVideoPlayback = (videoEl) => { if (videoEl.paused) { videoEl.play().catch(() => {}); } else { videoEl.pause(); } };
function setupIntersectionAutoplay() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const vid = entry.target.querySelector('video');
      if (vid) {
        if (entry.isIntersecting) { vid.muted = false; vid.play().catch(() => {}); } 
        else { vid.pause(); }
      }
    });
  }, { threshold: 0.5 });
  document.querySelectorAll('.reel-item').forEach(el => observer.observe(el));
}

function startReleaseCountdown(lockDate, lockedAmount) {
  const countdownEl = document.getElementById("nextReleaseCountdown");
  if (!countdownEl) return;
  if (!lockedAmount || lockedAmount <= 0 || !lockDate) { countdownEl.innerText = "No locked tokens"; return; }
  const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
  const nextReleaseTime = lockDate + thirtyDaysMs;
  const interval = setInterval(() => {
    const now = Date.now();
    const timeLeft = nextReleaseTime - now;
    if (!document.getElementById("nextReleaseCountdown")) { clearInterval(interval); return; }
    if (timeLeft <= 0) { countdownEl.innerText = "Ready! Refresh page"; clearInterval(interval); return; }
    const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
    const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
    const formattedDate = new Date(nextReleaseTime).toLocaleDateString();
    countdownEl.innerText = `${days}d ${hours}h ${minutes}m ${seconds}s (${formattedDate})`;
  }, 1000);
}

window.withdraw = async () => {
  const phone = localStorage.getItem("user");
  const withdrawInput = document.getElementById("withdraw");
  const amount = parseFloat(withdrawInput ? withdrawInput.value.trim() : "0");
  const priceUsd = await getPrice();
  
  if (!amount || amount <= 0) return customAlert("Please enter a valid Temple_DA withdrawal amount!");

  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return customAlert("User session not found!");
  const u = snap.val();

  const investment = Number(u.investment || 0);
  const activeTier = checkAndHandlePackageExpiry(phone, u);
  const hasValidActivePackage = activeTier !== "none" && u.packageExpiresAt && Date.now() <= u.packageExpiresAt;
  const isCtoActive = (u.ctoActiveClub && u.ctoActiveClub > 0) || u.inWaitingQueue || u.inHoldingQueueForClub || u.isCrownAmbassador;

  if (investment <= 0 && !hasValidActivePackage && !isCtoActive) {
    return customAlert("An active account status (Investment, Active Creator Package, or Active CTO Club Membership) is required before making withdrawals!");
  }

  const now = new Date();
  const todayDateString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  let lastWithdrawDate = u.lastWithdrawDate || "";
  let todayWithdrawnAmount = Number(u.todayWithdrawnAmount || 0);
  if (lastWithdrawDate !== todayDateString) {
    todayWithdrawnAmount = 0;
  }

  const maxDailyAllowed = getEffectiveTierLimit(u);
  if (todayWithdrawnAmount >= maxDailyAllowed) {
    return customAlert(`⚠️ Daily Withdrawal Limit Reached!\nYour current account tier allows a maximum of ${maxDailyAllowed} Temple_DA per day. You have already withdrawn ${todayWithdrawnAmount} Temple_DA today. Please try again tomorrow.`);
  }
  if ((todayWithdrawnAmount + amount) > maxDailyAllowed) {
    return customAlert(`⚠️ Daily Limit Exceeded!\nYou can withdraw a maximum of ${maxDailyAllowed - todayWithdrawnAmount} Temple_DA more today.`);
  }
  if (amount > (u.balance || 0)) return customAlert("Insufficient Temple_DA balance!");
  
  const userWallet = u.wallet;
  if (!userWallet || !walletRegex.test(userWallet)) return customAlert("No valid BEP20 wallet linked to your account!");

  const ninetyPercentTokens = Number((amount * 0.90).toFixed(2));
  const tenPercentTokens = Number((amount * 0.10).toFixed(2));
  const tenPercentUSDT = Number((tenPercentTokens * priceUsd).toFixed(2));

  const newBalance = Number((u.balance - amount).toFixed(2));
  const newTodayWithdrawn = Number((todayWithdrawnAmount + amount).toFixed(2));

  await update(ref(db, "users/" + phone), { 
    balance: newBalance, 
    lastWithdrawDate: todayDateString, 
    todayWithdrawnAmount: newTodayWithdrawn 
  });

  const reqRef = push(ref(db, "withdrawals/pending"));
  const reqKey = reqRef.key;
  await set(reqRef, { phone: phone, amount: ninetyPercentTokens, totalRequested: amount, tenPercentActivationUSDT: tenPercentUSDT, wallet: userWallet, timestamp: Date.now() });
  await set(ref(db, "withdrawals/history/" + phone + "/" + reqKey), { amount: ninetyPercentTokens, totalRequested: amount, tenPercentActivationUSDT: tenPercentUSDT, wallet: userWallet, timestamp: Date.now(), status: "Pending Admin Approval (10% Activation USDT credits upon approval)" });

  if (withdrawInput) withdrawInput.value = "";
  customAlert(`🎉 Success! Withdrawal Request of ${amount} Temple_DA Submitted!\n\n• ${amount} Temple_DA deducted from balance immediately.\n• 90% (${ninetyPercentTokens} Temple_DA) queued for direct delivery to your BEP20 wallet.\n• 10% ($${tenPercentUSDT} USDT) will be credited to your Activation Wallet once approved by admin.`);
};

window.makeDirectUSDTDeposit = async () => {
  const phone = localStorage.getItem("user");
  const investInput = document.getElementById("invest");
  const amount = parseFloat(investInput ? investInput.value.trim() : "0");

  if (!amount || amount < 1) return customAlert("Investment amount must be at least 1 USDT");

  const userSnap = await get(ref(db, "users/" + phone));
  if (!userSnap.exists()) return customAlert("User session not found!");
  const u = userSnap.val();

  const currentInvestment = Number(u.investment || 0);
  if (currentInvestment + amount > 500) return customAlert(`Maximum total investment limit is 500 USDT!\nYour current investment is ${currentInvestment} USDT. You can invest up to ${500 - currentInvestment} USDT more.`);

  try {
    const { tx } = await executeUsdtTransfer(amount, `${amount} USDT Investment Deposit`);
    const currentPrice = await getPrice();
    const temple_DA = Number((amount / currentPrice).toFixed(2));
    
    await update(ref(db, "users/" + phone), {
      investment: currentInvestment + amount, locked: Number(u.locked || 0) + temple_DA,
      monthlyBusiness: Number(u.monthlyBusiness || 0) + amount, lockDate: u.lockDate || Date.now()
    });
    await push(ref(db, "investments/history/" + phone), { amountUSDT: amount, txHash: tx.hash, timestamp: Date.now() });

    const isSingleShotEligible = (amount >= 25);
    const notInAnyClubYet = (!u.ctoActiveClub || u.ctoActiveClub === 0) && !u.inWaitingQueue && !u.inHoldingQueueForClub && !u.isCrownAmbassador;

    if (isSingleShotEligible && notInAnyClubYet) {
      await recordMasterInflowAndDistribute(phone, amount, `Single-Shot Deposit ($${amount})`);
      await processClub1Allocation(phone, u.name || "Member", `Single-Shot Deposit ($${amount})`);
    } else {
      await recordMasterInflowAndDistribute(phone, amount, `Staking Investment ($${amount})`);
    }

    if (investInput) investInput.value = "";
    customAlert(`✅ Success! ${amount} USDT deposited successfully via Web3 Wallet.\n${temple_DA} Temple_DA added to locked yield (5% monthly release)!`);
  } catch (error) { customAlert("Deposit Failed: " + formatWeb3Error(error)); }
};

async function checkDailyVideoLimit(phone, userTier) {
  if (userTier === "yearly" || userTier === "120") return true; // Unlimited
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  try {
    const postsSnap = await get(ref(db, "posts"));
    let todayVideoCount = 0;
    if (postsSnap.exists()) {
      postsSnap.forEach(s => {
        const p = s.val();
        if (p.authorPhone === phone && p.type === "video" && Number(p.createdAt || 0) >= startOfDay) todayVideoCount++;
      });
    }
    let maxAllowed = 2; // Starter $5
    if (userTier === "monthly" || userTier === "15") maxAllowed = 5;
    else if (userTier === "50" || userTier === "advanced") maxAllowed = 25;

    if (todayVideoCount >= maxAllowed) {
      customAlert(`⚠️ Daily Video Limit Reached!\nYour current package daily limit of ${maxAllowed} videos has been reached.`);
      return false;
    }
    return true;
  } catch (err) { return false; }

  const publishBtn = document.getElementById("publishBtn");
  try {
    const phone = localStorage.getItem("user");
    if (!phone) return customAlert("Please login first");
    const userSnap = await get(ref(db, "users/" + phone));
    const u = userSnap.exists() ? userSnap.val() : {};
    const activeTier = checkAndHandlePackageExpiry(phone, u);

    if (activeTier === "none") return customAlert("⚠️ Package Required!\nYou must purchase an active Creator Package ($5, $15, $50, or $120) before publishing reels and videos.");

    const typeEl = document.getElementById("talentType"), titleEl = document.getElementById("talentTitle"), mediaEl = document.getElementById("talentMedia"), descEl = document.getElementById("talentText"), fileInput = document.getElementById("talentFile");
    const type = typeEl ? typeEl.value : "video", title = titleEl ? titleEl.value.trim() : "";
    let mediaUrl = mediaEl ? mediaEl.value.trim() : "";
    const description = descEl ? descEl.value.trim() : "", file = fileInput && fileInput.files ? fileInput.files[0] : null;

    if (!title) return customAlert("Please enter title/caption!");
    if (type === "video") {
      const isAllowed = await checkDailyVideoLimit(phone, activeTier);
      if (!isAllowed) { if (publishBtn) publishBtn.disabled = false; return; }
    }

    let storagePath = "";
    const progressContainer = document.getElementById("uploadProgressContainer"), progressBar = document.getElementById("uploadProgressBar"), statusText = document.getElementById("uploadStatusText");

    if (file) {
      if (file.size > 25 * 1024 * 1024) return customAlert("File size must be less than 25MB for direct upload!");
      if (publishBtn) publishBtn.disabled = true;
      if (progressContainer) progressContainer.style.display = "block";
      if (statusText) statusText.innerText = "Processing & Converting file...";
      try {
        mediaUrl = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = (e) => resolve(e.target.result); reader.onerror = (e) => reject(e); reader.readAsDataURL(file); });
        if (progressBar) progressBar.style.width = "100%";
      } catch (fileErr) {
        if (publishBtn) publishBtn.disabled = false;
        if (progressContainer) progressContainer.style.display = "none";
        return customAlert("Failed to read file from device.");
      }
    }

    if (type !== "text" && !mediaUrl) {
      if (publishBtn) publishBtn.disabled = false;
      if (progressContainer) progressContainer.style.display = "none";
      return customAlert("Select video/image file or provide a direct video/Instagram URL!");
    }

    const newPostRef = push(ref(db, "posts"));
    await set(newPostRef, { authorPhone: phone, authorName: u.name || "Creator", type: type || "video", title: title, mediaUrl: mediaUrl || "", storagePath: storagePath || "", description: description || "", likesCount: 0, createdAt: Date.now() });

    let earnPts = type === "video" ? 3 : 1;
    await update(ref(db, "users/" + phone), { points: Number(u.points || 0) + earnPts });
    await push(ref(db, `points_history/${phone}`), { source: "Post Upload", points: earnPts, timestamp: Date.now() });

    window.showModalPopup("Post Published! 🎉", "You earned points for sharing your talent.", `+${earnPts} XP Points`, "Awesome!");
    location.hash = "#feed";
  } catch (error) {
    if (publishBtn) publishBtn.disabled = false;
    customAlert("Publish error: " + error.message);
  }
};

window.likePost = async (postId) => {
  try {
    const userPhone = localStorage.getItem("user");
    if (!userPhone) return customAlert("Please login to like");

    const postSnap = await get(ref(db, `posts/${postId}`));
    if (!postSnap.exists()) return customAlert("Post not found");
    const pData = postSnap.val();
    const authorPhone = pData.authorPhone;

    if (userPhone === authorPhone) return customAlert("You cannot like your own post");

    const likeCheck = await get(ref(db, `likes/${postId}/${userPhone}`));
    if (likeCheck.exists()) return customAlert("You have already supported this post!");

    await set(ref(db, `likes/${postId}/${userPhone}`), true);
    await update(ref(db, `posts/${postId}`), { likesCount: Number(pData.likesCount || 0) + 1 });

    const actualType = pData.type || "video";
    let creatorPts = actualType === "video" ? 3 : 1;
    let viewerPts = actualType === "video" ? 2 : (actualType === "photo" ? 1 : 0);

    const authorSnap = await get(ref(db, "users/" + authorPhone));
    if (authorSnap.exists()) {
      await update(ref(db, "users/" + authorPhone), { points: Number(authorSnap.val().points || 0) + creatorPts });
      await push(ref(db, `points_history/${authorPhone}`), { source: "Reel Like / View", points: creatorPts, timestamp: Date.now() });
    }

    if (viewerPts > 0) {
      const viewerSnap = await get(ref(db, "users/" + userPhone));
      if (viewerSnap.exists()) {
        await update(ref(db, "users/" + userPhone), { points: Number(viewerSnap.val().points || 0) + viewerPts });
        await push(ref(db, `points_history/${userPhone}`), { source: "Reel Like / View", points: viewerPts, timestamp: Date.now() });

  } catch (err) { customAlert("Like error: " + err.message); }
};

window.convertPointsToToken = async () => {
  const phone = localStorage.getItem("user");
  if (!phone) return customAlert("Please login");
  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return customAlert("User not found");
  const u = snap.val();

  const currentPoints = Number(u.points || 0);
  if (currentPoints < 1000) return customAlert("Minimum 1000 points required to convert to Temple_DA.");

  const activeTier = checkAndHandlePackageExpiry(phone, u);
  const hasActivePackage = activeTier !== "none";

  let directReferralsCount = 0;
  const allUsersSnap = await get(ref(db, "users"));
  if (allUsersSnap.exists()) {
    allUsersSnap.forEach(child => { if (child.val().referrer === phone) directReferralsCount++; });
  }

  if (!hasActivePackage && directReferralsCount < 1) return customAlert("⚠️ Conversion Restricted!\nTo convert your points to Temple_DA, you must either have an Active Package or at least 1 Direct Referral.");

  const convertiblePoints = Math.floor(currentPoints / 200) * 200;
  const remainingPoints = currentPoints - convertiblePoints;
  const tokensToCredit = Number((convertiblePoints / 200).toFixed(2));
  const newBalance = Number(((u.balance || 0) + tokensToCredit).toFixed(2));

  await update(ref(db, "users/" + phone), { points: remainingPoints, balance: newBalance });
  customAlert(`🎉 Congratulations! ${convertiblePoints} Points successfully converted to ${tokensToCredit} Temple_DA! Remaining points: ${remainingPoints}`);
};

window.runCtoGlobalDistribution = async () => {
  try {
    const masterSnap = await get(ref(db, "cto_master"));
    if (!masterSnap.exists()) return customAlert("No master pool data found.");
    const master = masterSnap.val();

    const cto8Available = master.cto8PoolUSDT || 0;
    const cto2Available = master.cto2WaitingPoolUSDT || 0;
    const ambassadorAvail = master.ambassadorPoolUSDT || 0;

    if (cto8Available <= 0 && cto2Available <= 0 && ambassadorAvail <= 0) {
      return customAlert("Available CTO pools are 0 USDT. No new inflow to distribute.");
    }

    const currentPrice = await getPrice();
    const clubsSnap = await get(ref(db, "cto_clubs"));
    const clubsData = clubsSnap.exists() ? clubsSnap.val() : {};

    let totalSlotsRewarded = 0;
    let autoUpgradesCount = 0;
    let newAmbassadorsCount = 0;
    let updates = {};
    let vacatedClubsToPromote = [];

    let unallocatedToAdmin = 0; 
    let excessFlushOutToAdmin = 0; 

    let tsunamiCto8 = 0;
    let tsunamiCto2 = 0;
    let tsunamiAdmin = 0;

    for (const cfg of CTO_CLUBS_CONFIG) {
      const cSlots = (clubsData[cfg.id] && clubsData[cfg.id].slots) ? clubsData[cfg.id].slots : {};
      const activeKeys = Object.keys(cSlots).filter(k => cSlots[k].status === "active");
      const clubShareUSDT = (cto8Available * (cfg.ctoSharePct / 8.00));
      
      if (activeKeys.length > 0) {
        const payoutPerSlotUSDT = clubShareUSDT / activeKeys.length;

        for (const slotKey of activeKeys) {
          const s = cSlots[slotKey];
          const currentEarned = Number(s.earnedUSDT || 0);
          const potentialEarned = currentEarned + payoutPerSlotUSDT;
          
          if (potentialEarned >= cfg.grossCap) {
            const excess = potentialEarned - cfg.grossCap;
            if (excess > 0) excessFlushOutToAdmin += excess;

            const newEarned = cfg.grossCap;
            updates[`cto_clubs/${cfg.id}/slots/${slotKey}/earnedUSDT`] = newEarned;

            if (!s.netProfitCredited) {
              const netProfitUSDT = cfg.netUserWithdrawal;
              const netTokens = Number((netProfitUSDT / currentPrice).toFixed(2));
              const snapBal = await get(ref(db, `users/${s.phone}/balance`));
              const currentBal = Number(snapBal.val() || 0);
              const activeBalToUpdate = updates[`users/${s.phone}/balance`] !== undefined ? updates[`users/${s.phone}/balance`] : currentBal;
              updates[`users/${s.phone}/balance`] = Number((activeBalToUpdate + netTokens).toFixed(2));
              updates[`cto_clubs/${cfg.id}/slots/${slotKey}/netProfitCredited`] = true;
            }

            updates[`cto_clubs/${cfg.id}/slots/${slotKey}`] = null; 
            vacatedClubsToPromote.push(cfg.id);

            if (cfg.id < 10) {
              const nextClubId = cfg.id + 1;
              const nextClubCfg = CTO_CLUBS_CONFIG.find(c => c.id === nextClubId);
              const nextClubSlotsSnap = await get(ref(db, `cto_clubs/${nextClubId}/slots`));
              const nextCurrentSlots = Object.keys(nextClubSlotsSnap.val() || {}).length;

              if (nextCurrentSlots < nextClubCfg.slotsMax) {
                const nextSlotKey = push(ref(db)).key;
                updates[`cto_clubs/${nextClubId}/slots/${nextSlotKey}`] = {
                  phone: s.phone, userName: s.userName, earnedUSDT: 0, capUSDT: nextClubCfg.grossCap, status: "active", joinedAt: Date.now()
                };
                updates[`users/${s.phone}/ctoActiveClub`] = nextClubId;
                updates[`users/${s.phone}/inHoldingQueueForClub`] = null;
              } else {
                const qKey = push(ref(db)).key;
                updates[`cto_upgrade_queues/${nextClubId}/${qKey}`] = {
                  phone: s.phone, userName: s.userName, paidAmount: cfg.upgradeCost, targetClubId: nextClubId, timestamp: Date.now()
                };
                updates[`users/${s.phone}/ctoActiveClub`] = 0;
                updates[`users/${s.phone}/inHoldingQueueForClub`] = nextClubId;
                updates[`users/${s.phone}/holdingQueueJoinedAt`] = Date.now();
              }
              autoUpgradesCount++;
            } else {
              updates[`users/${s.phone}/ctoActiveClub`] = 0;
              updates[`users/${s.phone}/isCrownAmbassador`] = true;
              
              tsunamiCto8 += 5600;  
              tsunamiCto2 += 1400;  
              tsunamiAdmin += 3000; 
              newAmbassadorsCount++;
            }
          } else {
            updates[`cto_clubs/${cfg.id}/slots/${slotKey}/earnedUSDT`] = Number(potentialEarned.toFixed(2));
          }
          totalSlotsRewarded++;
        }
      } else {
          unallocatedToAdmin += clubShareUSDT;
      }
    }

    const queueSnap = await get(ref(db, "cto_waiting_queue"));
    let waitingRewardedCount = 0;
    if (cto2Available > 0) {
      if (queueSnap.exists()) {
          const qData = queueSnap.val();
          const qKeys = Object.keys(qData);
          if (qKeys.length > 0) {
            const perMemberUSDT = cto2Available / qKeys.length;
            qKeys.forEach(k => {
              const cur2x = Number(qData[k].earned2x || 0);
              const potential2x = cur2x + perMemberUSDT;
              if (potential2x >= 50) {
                const excess = potential2x - 50;
                if(excess > 0) excessFlushOutToAdmin += excess;
                updates[`cto_waiting_queue/${k}/earned2x`] = 50;
              } else {
                updates[`cto_waiting_queue/${k}/earned2x`] = Number(potential2x.toFixed(2));
              }
              waitingRewardedCount++;
            });
          } else {
            unallocatedToAdmin += cto2Available;
          }
      } else {
          unallocatedToAdmin += cto2Available;
      }
    }

    let royaltyPaidCount = 0;
    if (ambassadorAvail > 0) {
        const usersGlobalSnap = await get(ref(db, "users"));
        let ambassadorPhones = [];
        if (usersGlobalSnap.exists()) {
            usersGlobalSnap.forEach(ch => { if(ch.val().isCrownAmbassador) ambassadorPhones.push(ch.key); });
        }
        
        if (ambassadorPhones.length > 0) {
            const perAmbassadorUSDT = ambassadorAvail / ambassadorPhones.length;
            const perAmbTokens = Number((perAmbassadorUSDT / currentPrice).toFixed(2));
            for(const ambPhone of ambassadorPhones) {
                const snapBal = await get(ref(db, `users/${ambPhone}/balance`));
                const currentBal = Number(snapBal.val() || 0);
                const activeBalToUpdate = updates[`users/${ambPhone}/balance`] !== undefined ? updates[`users/${ambPhone}/balance`] : currentBal;
                updates[`users/${ambPhone}/balance`] = Number((activeBalToUpdate + perAmbTokens).toFixed(2));
                royaltyPaidCount++;
            }
        } else {
            unallocatedToAdmin += ambassadorAvail;
        }
    }

    const curAdmin = master.adminReserveUSDT || 0;
    const newAdminTotal = curAdmin + unallocatedToAdmin + excessFlushOutToAdmin + tsunamiAdmin;

    updates[`cto_master/cto8PoolUSDT`] = Number((tsunamiCto8).toFixed(2));
    updates[`cto_master/cto2WaitingPoolUSDT`] = Number((tsunamiCto2).toFixed(2));
    updates[`cto_master/ambassadorPoolUSDT`] = 0;
    updates[`cto_master/adminReserveUSDT`] = Number((newAdminTotal).toFixed(2));
    updates[`cto_master/lastDistributedAt`] = Date.now();

    await update(ref(db), updates);

    for (const vClub of vacatedClubsToPromote) {
        await promoteNextInQueue(vClub);
    }

    let alertMsg = `✅ CTO Distribution Complete!\n\n• ${totalSlotsRewarded} Members rewarded.\n• ${waitingRewardedCount} Waiting members updated.\n• $${unallocatedToAdmin.toFixed(2)} added to Admin Reserve.`;
    customAlert(alertMsg);
  } catch (err) {
    customAlert("Distribution Error: " + err.message);
  }
};

window.approveAndSendWithdrawal = async (reqKey, phone, userWallet, amount, activationUSDT) => {
  if (typeof window.ethereum === 'undefined') return customAlert("Admin Web3 Wallet (MetaMask) not detected!");
  try {
    showWeb3Toast("Preparing token transfer on BSC...");
    await ensureBscNetwork();
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    const provider = new ethers.providers.Web3Provider(window.ethereum, "any");
    const signer = provider.getSigner();

    const contract = new ethers.Contract(TEMPLE_DA_CONTRACT, BEP20_ABI, signer);
    let decimals = 18;
    try { decimals = await contract.decimals(); } catch (e) { decimals = 18; }
    const parsedAmount = ethers.utils.parseUnits(amount.toString(), decimals);

    showWeb3Toast(`Sending ${amount} Temple_DA... Confirm in wallet!`);
    const tx = await contract.transfer(userWallet, parsedAmount, { gasLimit: ethers.BigNumber.from("120000") });
    hideWeb3Toast();
    customAlert("Transaction broadcasted! Hash: " + tx.hash);
    await tx.wait(1);

    await remove(ref(db, "withdrawals/pending/" + reqKey));
    
    const userSnap = await get(ref(db, "users/" + phone));
    if (userSnap.exists()) {
      const uData = userSnap.val();
      await update(ref(db, "users/" + phone), { activationWallet: Number(((uData.activationWallet || 0) + activationUSDT).toFixed(2)) });
    }

    await update(ref(db, "withdrawals/history/" + phone + "/" + reqKey), { status: `Approved & Sent (90% Tokens Dispatched, $${activationUSDT} USDT Added to Activation Wallet)`, txHash: tx.hash, processedAt: Date.now() });
    customAlert(`✅ Withdrawal successfully approved!\n• 90% (${amount} Temple_DA) sent to user BEP-20 wallet.\n• 10% ($${activationUSDT} USDT) credited to user's Activation Wallet!`);
  } catch (error) { hideWeb3Toast(); customAlert("Payout failed: " + formatWeb3Error(error)); }
};

window.rejectWithdrawal = async (reqKey, phone) => {
  const snap = await get(ref(db, "withdrawals/pending/" + reqKey));
  if (snap.exists()) {
    const d = snap.val();
    const userSnap = await get(ref(db, "users/" + phone));
    if (userSnap.exists()) {
      const u = userSnap.val();
      const refundAmount = Number((d.totalRequested || d.amount));
      const newBal = Number(((u.balance || 0) + refundAmount).toFixed(2));
      const rolledBackToday = Math.max(0, Number(((u.todayWithdrawnAmount || 0) - refundAmount).toFixed(2)));
      await update(ref(db, "users/" + phone), { balance: newBal, todayWithdrawnAmount: rolledBackToday });
    }
  }
  await remove(ref(db, "withdrawals/pending/" + reqKey));
  await update(ref(db, "withdrawals/history/" + phone + "/" + reqKey), { status: "Rejected & Full Balance Refunded", processedAt: Date.now() });
  customAlert("Withdrawal rejected. Deducted balance has been fully refunded back to user's Main Balance.");
};

async function loadTeamNetworkInfo(phone) {
  try {
    const el = document.getElementById("teamNetworkData");
    if (!el) return;
    
    const usersSnap = await get(ref(db, "users"));
    if (!usersSnap.exists()) { el.innerHTML = "<p class='small'>No team data found.</p>"; return; }

    let allUsers = {};
    usersSnap.forEach(child => { allUsers[child.key] = child.val(); });

    let levelData = []; 
    for(let i=0; i<15; i++) {
        levelData.push({total: 0, active: 0, business: 0, directsList: []});
    }

    let currentLevelPhones = [phone];

    for (let i = 0; i < 15; i++) {
      if (currentLevelPhones.length === 0) break;
      let nextLevelPhones = [];

      for (const parentPhone of currentLevelPhones) {
        for (const uPhone in allUsers) {
          if (allUsers[uPhone].referrer === parentPhone) {
            nextLevelPhones.push(uPhone);
            const uData = allUsers[uPhone];

            // Check if user is active (Has active package OR CTO Club OR Investment >= $25)
            const isPkgActive = isUserPackageActive(uData);
            const isCtoActive = (uData.ctoActiveClub > 0 || uData.inWaitingQueue || uData.inHoldingQueueForClub || uData.isCrownAmbassador);
            const isActive = isPkgActive || isCtoActive || (Number(uData.investment || 0) >= 25);

            // Calculate Business (Using Monthly Business + Total Investment)
            const business = Number(uData.investment || 0) + Number(uData.monthlyBusiness || 0);

            levelData[i].total++;
            if (isActive) levelData[i].active++;
            levelData[i].business += business;

            // Store Directs Data for Level 1 Only
            if (i === 0) {
              levelData[0].directsList.push({ phone: uPhone, name: uData.name, active: isActive, biz: business });
            }
          }
        }
      }
      currentLevelPhones = nextLevelPhones;
    }

    // Build UI HTML
    let html = `<h4 style="color:#00ff88; margin-bottom:8px;">👤 My Direct Referrals (Level 1)</h4>`;
    if (levelData[0].directsList.length === 0) {
      html += `<p class="small" style="margin-bottom:14px;">You have no direct referrals yet.</p>`;

          <td style="color:#dfb72c;">$${d.biz.toFixed(2)}</td>
        </tr>`;
      });
      html += `</table>`;
    }

    html += `<h4 style="color:#dfb72c; margin-bottom:8px;">📊 15-Level Network Summary</h4>`;
    html += `<table><tr><th>Level</th><th>Registered</th><th>Active</th><th>Business Volume</th></tr>`;
    let totalBizAll = 0, totalRegAll = 0, totalActAll = 0;
    
    for(let i=0; i<15; i++) {
      if (levelData[i].total > 0) {
        html += `<tr>
          <td>Level ${i+1}</td>
          <td>${levelData[i].total}</td>
          <td style="color:#00ff88;">${levelData[i].active}</td>
          <td style="color:#dfb72c;">$${levelData[i].business.toFixed(2)}</td>
        </tr>`;
        totalRegAll += levelData[i].total;

      html += `<div class="small" style="border-bottom:1px solid rgba(223, 183, 44, 0.2); padding:7px 0;"><span class="badge-tag">${d.tier.toUpperCase()}</span> - ${d.amountUSDT} USDT <br><span style="color:#888;">${date}</span></div>`; 
    });
    const el = document.getElementById("packageHistory");
    if (el) el.innerHTML = html || "No package history found.";
  } catch(e) {}
}

async function loadGiftHistory(phone) {
  try {
    const snap = await get(ref(db, "gift_history/" + phone));
    const el = document.getElementById("giftHistory");
    if (!el) return;
    if (!snap.exists()) { el.innerHTML = `<p class="small">No gift history yet.</p>`; return; }
    const data = snap.val(), sentGifts = data.sent ? Object.values(data.sent) : [], receivedGifts = data.received ? Object.values(data.received) : [];

    let html = `<h4 style="color:#dfb72c; margin-bottom:6px; font-size:12px;">🎁 Received Gifts</h4>`;
    if (receivedGifts.length > 0) {
      receivedGifts.sort((a, b) => b.timestamp - a.timestamp);
      receivedGifts.forEach(g => {
        const date = new Date(g.timestamp).toLocaleString();
        html += `<div class="small" style="border-bottom:1px solid rgba(223, 183, 44, 0.2); padding:5px 0;">Received <span class="number">+${g.amount} Temple_DA</span> from <b>@${g.senderName}</b> (${maskPhone(g.senderPhone)})<br><span style="color:#888;">${date}</span></div>`;
      });
    } else { html += `<p class="small" style="margin-bottom:8px;">No gifts received yet.</p>`; }

    html += `<h4 style="color:#dfb72c; margin:12px 0 6px 0; font-size:12px;">📤 Sent Gifts</h4>`;
    if (sentGifts.length > 0) {
      sentGifts.sort((a, b) => b.timestamp - a.timestamp);
      sentGifts.forEach(g => {
        const date = new Date(g.timestamp).toLocaleString();
        html += `<div class="small" style="border-bottom:1px solid rgba(223, 183, 44, 0.2); padding:5px 0;">Sent <span class="number">-${g.amount} Temple_DA</span> to <b>@${g.recipientName}</b> (${maskPhone(g.recipientName)})<br><span style="color:#888;">${date}</span></div>`;
      });
    } else { html += `<p class="small">No gifts sent yet.</p>`; }
    el.innerHTML = html;
  } catch(e) {}
}

async function loadMyPosts(phone) {
  try {
    const snap = await get(ref(db, "posts"));
    const container = document.getElementById("myUploadedPosts");
    if (!container) return;
    if (!snap.exists()) { container.innerHTML = `<p class="small">You haven't uploaded any reels yet.</p>`; return; }
    
    let myPosts = [];
    snap.forEach(child => { const p = child.val(); if (p.authorPhone === phone) myPosts.push({ id: child.key, ...p }); });
    if (myPosts.length === 0) { container.innerHTML = `<p class="small">You haven't uploaded any reels yet.</p>`; return; }
    
    myPosts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

    let html = `<table><tr><th>Type</th><th>Title</th><th>Likes</th><th>Action</th></tr>`;
    myPosts.forEach(p => {
      html += `<tr><td><span class="badge-tag">${p.type}</span></td><td><b>${p.title}</b></td><td><span class="number">${p.likesCount || 0}</span></td>
      <td><button onclick="deleteMyPost('${p.id}', '${p.storagePath || ''}')" class="btn-danger" style="width:auto; padding:4px 10px; font-size:10px;">Delete</button></td></tr>`;
    });
    container.innerHTML = html + `</table>`;
  } catch(e) {}
}

function v(id) { const el = document.getElementById(id); return el ? el.value.trim() : ""; }
function appDiv() { return document.getElementById("app"); }
