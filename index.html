async function getLivePriceData() {
  try {
    const res = await fetch("https://api.dexscreener.com/latest/dex/pairs/bsc/0x707171A0C27f87B8C530B20831f7B004e6647830");
    const data = await res.json();
    if (data && data.pair && data.pair.priceUsd) {
      const priceUsd = parseFloat(data.pair.priceUsd);
      let inrRate = 83.5; 
      try {
        const rateRes = await fetch("https://open.er-api.com/v6/latest/USD");
        const rateData = await rateRes.json();
        if (rateData && rateData.rates && rateData.rates.INR) {
          inrRate = rateData.rates.INR;
        }
      } catch (e) {}
      
      return {
        usd: priceUsd,
        inr: priceUsd * inrRate
      };
    }
  } catch (err) {}

  const s = await get(ref(db, "config/temple_DAPrice"));
  const pUsd = s.exists() ? s.val() : 0.0002;
  return { usd: pUsd, inr: pUsd * 83.5 };
}

window.toggleVideoPlayback = (videoEl) => {
  if (videoEl.paused) {
    videoEl.muted = false;
    videoEl.play();
  } else {
    videoEl.pause();
  }
};

function setupIntersectionAutoplay() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const vid = entry.target.querySelector('video');
      if (vid) {
        if (entry.isIntersecting) {
          vid.play().catch(() => {});
        } else {
          vid.pause();
          vid.muted = true;
        }
      }
    });
  }, { threshold: 0.5 });

  document.querySelectorAll('.reel-item').forEach(el => observer.observe(el));
}

async function checkDailyVideoLimit(phone, userTier) {
  if (userTier !== "starter") return true;

  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

  const postsSnap = await get(ref(db, "posts"));
  let todayVideoCount = 0;

  if (postsSnap.exists()) {
    postsSnap.forEach(s => {
      const p = s.val();
      if (p.authorPhone === phone && p.type === "video" && (p.createdAt || 0) >= startOfDay) {
        todayVideoCount++;
      }
    });
  }

  if (todayVideoCount >= 2) {
    alert("⚠️ Daily Video Limit Reached!\nAap Starter Pack par hain aur aaj ki 2 video limit complete ho chuki hai. Unlimited video uploads ke liye Pro Creator package activate karein!");
    return false;
  }
  return true;
}

    const typeEl = document.getElementById("talentType");
    const titleEl = document.getElementById("talentTitle");
    const mediaEl = document.getElementById("talentMedia");
    const descEl = document.getElementById("talentText");
    const fileInput = document.getElementById("talentFile");

    const type = typeEl ? typeEl.value : "video";
    const title = titleEl ? titleEl.value.trim() : "";
    let mediaUrl = mediaEl ? mediaEl.value.trim() : "";
    const description = descEl ? descEl.value.trim() : "";
    const file = fileInput && fileInput.files ? fileInput.files[0] : null;

    if (!title) return alert("Please enter title/caption!");

    if (type === "video") {
      const isAllowed = await checkDailyVideoLimit(phone, activeTier);
      if (!isAllowed) return;
    }

    let storagePath = "";

    if (file) {
      if (file.size > 50 * 1024 * 1024) return alert("File size 50MB se kam honi chahiye!");

      const publishBtn = document.getElementById("publishBtn");
      const progressContainer = document.getElementById("uploadProgressContainer");
      const progressBar = document.getElementById("uploadProgressBar");
      const statusText = document.getElementById("uploadStatusText");

      if (publishBtn) publishBtn.disabled = true;
      if (progressContainer) progressContainer.style.display = "block";

      const cleanFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
      storagePath = `posts/${phone}_${Date.now()}_${cleanFileName}`;
      const fileRef = sRef(storage, storagePath);
      const uploadTask = uploadBytesResumable(fileRef, file);

      await new Promise((resolve, reject) => {
        uploadTask.on(
          "state_changed",
          snapshot => {
            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
            if (progressBar) progressBar.style.width = progress + "%";
            if (statusText) statusText.innerText = `Uploading Reel: ${Math.round(progress)}%`;
          },
          error => {
            if (publishBtn) publishBtn.disabled = false;
            if (progressContainer) progressContainer.style.display = "none";
            reject(error);
          },
          async () => {
            mediaUrl = await getDownloadURL(uploadTask.snapshot.ref);
            resolve();
          }
        );
      });
    }

    if (type !== "text" && !mediaUrl) {
      return alert("Select video file or provide direct URL!");
    }

    const newPostRef = push(ref(db, "posts"));
    await set(newPostRef, {
      authorPhone: phone,
      authorName: u.name || "Creator",
      type: type || "video",
      title: title,
      mediaUrl: mediaUrl || "",
      storagePath: storagePath || "",
      description: description || "",
      likesCount: 0,
      createdAt: Date.now()
    });

    alert("Reel published successfully!");
    location.hash = "#feed";
  } catch (error) {
    console.error("Publish error:", error);
    alert("Publish error: " + error.message);
  }
};

window.likePost = async (postId) => {
  try {
    const userPhone = localStorage.getItem("user");
    if (!userPhone) return alert("Please login to like");

    const postSnap = await get(ref(db, `posts/${postId}`));
    if (!postSnap.exists()) return alert("Post not found");
    const pData = postSnap.val();
    const authorPhone = pData.authorPhone;

    if (userPhone === authorPhone) return alert("You cannot like your own post");

    const likeCheck = await get(ref(db, `likes/${postId}/${userPhone}`));
    if (likeCheck.exists()) return alert("You have already supported this post!");

    await set(ref(db, `likes/${postId}/${userPhone}`), true);

    await update(ref(db, `posts/${postId}`), {
      likesCount: Number(pData.likesCount || 0) + 1
    });

    const actualType = pData.type || "video";
    let creatorPts = actualType === "video" ? 3 : 1;
    let viewerPts = actualType === "video" ? 2 : (actualType === "photo" ? 1 : 0);

    const authorSnap = await get(ref(db, "users/" + authorPhone));
    if (authorSnap.exists()) {
      const aData = authorSnap.val();
      await update(ref(db, "users/" + authorPhone), {
        points: Number(aData.points || 0) + creatorPts
      });
    }

    const today = getTodayDateKey();
    const capRef = ref(db, `userLimits/${userPhone}/${today}/likesCount`);
    const capSnap = await get(capRef);
    const currentLikesToday = Number(capSnap.val() || 0);
    const MAX_REWARDED_LIKES_PER_DAY = 20;

    if (viewerPts > 0) {
      if (currentLikesToday < MAX_REWARDED_LIKES_PER_DAY) {
        const viewerSnap = await get(ref(db, "users/" + userPhone));
        if (viewerSnap.exists()) {
          const vData = viewerSnap.val();
          await update(ref(db, "users/" + userPhone), {
            points: Number(vData.points || 0) + viewerPts
          });
        }
        await set(capRef, currentLikesToday + 1);
        alert(`❤️ Liked! Creator: +${creatorPts} Pts | You: +${viewerPts} Pts (${currentLikesToday + 1}/${MAX_REWARDED_LIKES_PER_DAY} used today).`);
      } else {

      }

      alert(`❤️ Liked! Creator: +${creatorPts} Pts.`);

    alert("Like error: " + err.message);
  }
};

window.upgradePackageWithBalance = async (tierName, usdtAmount) => {
  const phone = localStorage.getItem("user");
  if (!phone) return alert("Please login to activate or upgrade a package");

  const userSnap = await get(ref(db, "users/" + phone));
  if (!userSnap.exists()) return alert("User not found");
  const u = userSnap.val();

  const currentPrice = await getPrice();
  const requiredTokens = Number((usdtAmount / currentPrice).toFixed(2));

  if ((u.balance || 0) < requiredTokens) {
    return alert(`Insufficient Balance! Is package ke liye ${requiredTokens} Temple_DA ki zaroorat hai. Aapka balance: ${Number(u.balance || 0).toFixed(2)} Temple_DA hai.`);
  }

  const durationMs = getPackageDurationMs(tierName);
  const durationDays = tierName === 'yearly' ? 365 : 30;

  const confirmAction = confirm(`Aapke balance se ${requiredTokens} Temple_DA deduct honge aur ${tierName.toUpperCase()} package agle ${durationDays} dino ke liye active hoga. Aage badhein?`);
  if (!confirmAction) return;

  const newBalance = Number((u.balance - requiredTokens).toFixed(2));
  const activatedAt = Date.now();
  const expiresAt = activatedAt + durationMs;

  await update(ref(db, "users/" + phone), {
    balance: newBalance,
    tier: tierName,
    packagePriceUSDT: usdtAmount,
    packageActivatedAt: activatedAt,
    packageExpiresAt: expiresAt,
    packageExpired: false
  });

  await push(ref(db, "packages/history/" + phone), {
    tier: tierName,
    amountUSDT: usdtAmount,
    temple_DAAmount: requiredTokens,
    validityDays: durationDays,
    expiresAt: expiresAt,
    method: "balance",
    time: activatedAt
  });

  alert(`Congratulations! ${tierName.toUpperCase()} package agle ${durationDays} dino ke liye successfully activate ho gaya!`);
  location.hash = "#user";
};

window.withdraw = async () => {
  const phone = localStorage.getItem("user");
  const amount = parseFloat(v("withdraw"));

  if (!amount || amount <= 0) return alert("Invalid amount");

  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return alert("User not found");
  const u = snap.val();

  if ((u.investment || 0) <= 0) return alert("Withdrawal not allowed without investment");

  let dailyLimit = 1000;
  const userInvestment = u.investment || 0;

  if (userInvestment >= 1 && userInvestment < 20) {
    dailyLimit = 60;
  }

  if (amount > dailyLimit) {
    return alert(`Aapke current investment (${userInvestment} USDT) ke anusar aap ek baar mein maximum ${dailyLimit} Temple_DA hi withdraw kar sakte hain.`);
  }

  const pending = await get(ref(db, "withdrawals/pending/" + phone));
  if (pending.exists()) return alert("Aapka pichla withdrawal request abhi pending hai.");

  if (amount > u.balance) return alert("Insufficient balance");

  const historySnap = await get(ref(db, "withdrawals/history/" + phone));
  let totalWithdrawnIn24Hours = 0;
  const twentyFourHoursAgo = Date.now() - (24 * 60 * 60 * 1000);

  if (historySnap.exists()) {
    historySnap.forEach(child => {
      const record = child.val();
      if (record.time && record.time > twentyFourHoursAgo) {
        totalWithdrawnIn24Hours += parseFloat(record.amount || 0);
      }
    });
  }

  if (totalWithdrawnIn24Hours + amount > dailyLimit) {
    const bachaHuaLimit = dailyLimit - totalWithdrawnIn24Hours;
    return alert(`Daily Limit Exceeded! Aaj aap maximum ${bachaHuaLimit.toFixed(2)} Temple_DA aur withdraw kar sakte hain.`);
  }

  await set(ref(db, "withdrawals/pending/" + phone), {
    amount,
    wallet: u.wallet,
    timestamp: Date.now()
  });

  alert("Withdrawal request successfully submitted for approval!");
};

}

async function loadPendingPackages() {
  const snap = await get(ref(db, "packages/pending"));
  let html = "";

  for (const child of Object.entries(snap.val() || {})) {
    const phone = child[0];
    const d = child[1];
    const durationDays = d.durationDays || (d.tier === 'yearly' ? 365 : 30);

    html += `
    <div class="card" style="border: 1px solid #00ff88;">
    <b>User:</b> ${phone}<br>
    <b>Requested Tier:</b> <span class="badge-tag">${d.tier.toUpperCase()}</span><br>
    <b>Validity Duration:</b> ${durationDays} Days<br>
    <b>Amount:</b> ${d.amountUSDT} USDT<br>
    <b>Wallet:</b> ${d.wallet}
    <br><br>
    <button onclick="approvePackage('${phone}','${d.tier}', ${d.amountUSDT})" style="background:#00ff88; color:#000;">Approve For ${durationDays} Days</button>
    <button onclick="rejectPackage('${phone}')" class="btn-danger">Reject</button>
    </div>`;
  }

  const el = document.getElementById("pendingPackages");
  if (el) el.innerHTML = html || "No pending package requests";
}

window.approvePackage = async (phone, tier, usdtAmount) => {
  const durationMs = getPackageDurationMs(tier);
  const durationDays = tier === 'yearly' ? 365 : 30;
  const activatedAt = Date.now();
  const expiresAt = activatedAt + durationMs;

  await update(ref(db, "users/" + phone), { 
    tier: tier,
    packagePriceUSDT: usdtAmount || 0,
    packageActivatedAt: activatedAt,
    packageExpiresAt: expiresAt,
    packageExpired: false
  });

  await push(ref(db, "packages/history/" + phone), {
    tier: tier,
    amountUSDT: usdtAmount || 0,
    validityDays: durationDays,
    expiresAt: expiresAt,
    method: "deposit_approval",
    time: activatedAt
  });

  await remove(ref(db, "packages/pending/" + phone));
  alert(`Package ${tier.toUpperCase()} activated for ${durationDays} days!`);
  loadPendingPackages();
};

window.rejectPackage = async phone => {
  await remove(ref(db, "packages/pending/" + phone));
  alert("Package request rejected");
  loadPendingPackages();
};

window.approveInvest = async phone => {
  const snap = await get(ref(db, "investments/pending/" + phone));
  const d = snap.val();
  const userSnap = await get(ref(db, "users/" + phone));
  const u = userSnap.val();

  const currentPrice = await getPrice();
  const newTemple_DAAmount = Number((d.amountUSDT / currentPrice).toFixed(2));

  const newInvestment = (u.investment || 0) + d.amountUSDT;
  const newLocked = (u.locked || 0) + newTemple_DAAmount;

  await update(ref(db, "users/" + phone), {
    investment: newInvestment,
    locked: newLocked,
    lockDate: u.lockDate || Date.now()
  });

  await push(ref(db, "investments/history/" + phone), {
    amountUSDT: d.amountUSDT,
    temple_DAAmount: newTemple_DAAmount,
    type: "invest",
    time: Date.now()
  });

  await distributeReferral(phone, d.amountUSDT);

  const poolSnap = await get(ref(db, "liquidityPool"));
  const pool = (poolSnap.val() || 0) + d.amountUSDT;
  await set(ref(db, "liquidityPool"), pool);

  await remove(ref(db, "investments/pending/" + phone));
  alert("Investment approved!");
};

window.approveUpgrade = async phone => {
  const snap = await get(ref(db, "investments/upgrade/" + phone));
  if (!snap.exists()) return alert("Upgrade not found");

  const d = snap.val();
  const userSnap = await get(ref(db, "users/" + phone));
  const u = userSnap.val();

  const currentPrice = await getPrice();
  const newTemple_DAAmount = Number((d.amountUSDT / currentPrice).toFixed(2));

  if ((u.investment || 0) + d.amountUSDT > 250) {
    alert("Upgrade exceeds maximum limit");
    await remove(ref(db, "investments/upgrade/" + phone));
    return;
  }

  const newLocked = (u.locked || 0) + newTemple_DAAmount;

  await update(ref(db, "users/" + phone), {
    investment: (u.investment || 0) + d.amountUSDT,
    locked: newLocked,
    lockDate: Date.now()
  });

  await push(ref(db, "investments/history/" + phone), {
    amountUSDT: d.amountUSDT,
    temple_DAAmount: newTemple_DAAmount,
    type: "upgrade",
    time: Date.now()
  });

  await distributeReferral(phone, d.amountUSDT);
  await remove(ref(db, "investments/upgrade/" + phone));
  alert("Upgrade approved!");
};

window.rejectUpgrade = async phone => {
  await remove(ref(db, "investments/upgrade/" + phone));
  alert("Upgrade request rejected");
  loadPendingUpgrade();
};

window.approveWithdraw = async phone => {
  const snap = await get(ref(db, "withdrawals/pending/" + phone));
  const d = snap.val();
  const userSnap = await get(ref(db, "users/" + phone));
  const u = userSnap.val();

  if (u.balance < d.amount) return alert("Insufficient balance");

  await update(ref(db, "users/" + phone), {
    balance: u.balance - d.amount
  });
  await push(ref(db, "withdrawals/history/" + phone), {
    amount: d.amount,
    wallet: d.wallet,
    time: Date.now()
  });

  await remove(ref(db, "withdrawals/pending/" + phone));
  alert("Withdrawal approved");
};

async function distributeReferral(phone, amount) {
  const levels = [10, 5, 2.5, 1, 1, 1, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1];
  let current = phone;
  const price = await getPrice();
  const tmpl = amount / price;

  for (let i = 0; i < 15; i++) {
    const s = await get(ref(db, "users/" + current));
    if (!s.exists()) break;

    const userData = s.val();
    const referrer = userData.referrer;
    if (!referrer) break;

    const rSnap = await get(ref(db, "users/" + referrer));
    if (!rSnap.exists()) break;
    const r = rSnap.val();

    if (i >= 1 && (r.investment || 0) < 20) {
      current = referrer;
      continue;
    }

    const bonus = tmpl * (levels[i] / 100);

    await update(ref(db, "users/" + referrer), {
      balance: Number((r.balance + bonus).toFixed(2))
    });

    current = referrer;
  }
}

function autoRelease(phone, u) {
  if (!u.lockDate || !u.locked || u.locked <= 0) return;

  const days = (Date.now() - u.lockDate) / (1000 * 60 * 60 * 24);

  if (days >= 30) {
    const cycles = Math.floor(days / 30);
    if (cycles < 1) return;

    let totalRelease = 0;
    let currentLocked = u.locked;

    for (let i = 0; i < cycles; i++) {
      const release = currentLocked * 0.05;
      totalRelease += release;
      currentLocked -= release;
      if (currentLocked < 0) {
        currentLocked = 0;
        break;
      }
    }

    const newBalance = Number(((u.balance || 0) + totalRelease).toFixed(2));
    const newLocked = Number(currentLocked.toFixed(2));

    const updates = {
      balance: newBalance,
      locked: newLocked,
      lockDate: Date.now()
    };

    if (newLocked <= 0) {
      updates.investment = 0;
      updates.lockDate = 0;
    }

    update(ref(db, "users/" + phone), updates).catch(err => console.error(err));
  }
}

window.releaseLocked = async phone => {
  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return alert("User not found");

  const u = snap.val();
  if (!u.locked || u.locked <= 0) return alert("No locked tokens to release");

  const releasedAmount = u.locked;

  await update(ref(db, "users/" + phone), {
    balance: (u.balance || 0) + releasedAmount,
    locked: 0,
    lockDate: 0,
    investment: 0
  });

  alert("Full cycle completed. User can invest again.");
};
