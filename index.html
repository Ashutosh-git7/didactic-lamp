window.registerUser = async () => {
  const name = v("name");
  const phone = v("phone");
  const wallet = v("wallet");
  const password = v("password");
  const referrer = v("ref");

  if (!walletRegex.test(wallet)) return alert("Invalid BEP20 wallet");
  const usersSnap = await get(ref(db, "users"));
  let walletExists = false;

  usersSnap.forEach(s => {
    if (s.val().wallet === wallet) walletExists = true;
  });

  if (walletExists) return alert("This wallet is already registered");

  const userSnap = await get(ref(db, "users/" + phone));
  if (userSnap.exists()) return alert("User exists");

  await set(ref(db, "users/" + phone), {
    name,
    wallet,
    password: btoa(password),
    balance: 6,
    investment: 0,
    locked: 0,
    lockDate: 0,
    referrer: referrer || "",
    createdAt: Date.now(),
    tier: "none",
    packagePriceUSDT: 0,
    packageActivatedAt: 0,
    packageExpiresAt: 0,
    packageExpired: false,
    points: 0,
    subscribersCount: 0
  });

  alert("Registration successful! 6 Temple_DA added.");
  location.hash = "#login";
};

  const pass = v("password");

  if (phone.includes("@")) {
    try {
      const userCredential = await signInWithEmailAndPassword(auth, phone, pass);
      const user = userCredential.user;
      const adminSnap = await get(ref(db, "admins/" + user.uid));
      
      if (adminSnap.exists()) {
        localStorage.setItem("admin", "1");
        location.hash = "#admin";
        alert("Admin Login Successful!");
      } else {
        alert("Aap authenticated hain par Admin list mein nahi hain.");
      }
    } catch (error) {
      alert("Admin Login Failed: " + error.message);
    }
    return;

  if (atob(user.password) !== pass) return alert("Wrong password");

  location.hash = "#user";
};

window.enableAudioOnFirstTouch = () => {
  const activeVideo = document.querySelector('.reel-item video');
  if (activeVideo && activeVideo.paused) {
    activeVideo.play().catch(() => {});
  }
};

window.toggleVideoPlayback = (videoEl) => {
  if (videoEl.paused) {
    videoEl.muted = false;
    videoEl.play();
  } else {
    videoEl.pause();
  }
};

function setupIntersectionAutoplay() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const vid = entry.target.querySelector('video');
      if (vid) {
        if (entry.isIntersecting) {
          vid.play().catch(() => {});
        } else {
          vid.pause();
          vid.muted = true;
        }
      }
    });
  }, { threshold: 0.5 });

  document.querySelectorAll('.reel-item').forEach(el => observer.observe(el));
}

      return;
    }

    let myPosts = [];
    snap.forEach(child => {
      const p = child.val();
      if (p.authorPhone === phone) {
        myPosts.push({ id: child.key, ...p });
      }

    if (myPosts.length === 0) {
      container.innerHTML = `<p class="small">Aapne abhi tak koi reel upload nahi ki hai.</p>`;
      return;

    myPosts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      <tr>
        <th>Type</th>

    myPosts.forEach(p => {

    });

    html += `</table>`;
    container.innerHTML = html;
  });
}

async function checkDailyVideoLimit(phone, userTier) {
  if (userTier === "yearly") return true;

  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

  const postsSnap = await get(ref(db, "posts"));
  let todayVideoCount = 0;

  if (postsSnap.exists()) {
    postsSnap.forEach(s => {
      const p = s.val();
      if (p.authorPhone === phone && p.type === "video" && (p.createdAt || 0) >= startOfDay) {
        todayVideoCount++;
      }
    });
  }

  let maxAllowed = 2;
  if (userTier === "monthly") {
    maxAllowed = 5;
  }

  if (todayVideoCount >= maxAllowed) {
    alert(`⚠️ Daily Video Limit Reached!\nAapke current (${userTier.toUpperCase()}) package ki aaj ki ${maxAllowed} video limit complete ho chuki hai.`);
    return false;
  }
  return true;
}

window.publishTalent = async () => {
  try {
    const phone = localStorage.getItem("user");
    if (!phone) return alert("Please login first");

    const userSnap = await get(ref(db, "users/" + phone));
    const u = userSnap.exists() ? userSnap.val() : {};
    const activeTier = checkAndHandlePackageExpiry(phone, u);

    const typeEl = document.getElementById("talentType");
    const titleEl = document.getElementById("talentTitle");
    const mediaEl = document.getElementById("talentMedia");
    const descEl = document.getElementById("talentText");
    const fileInput = document.getElementById("talentFile");

    const type = typeEl ? typeEl.value : "video";
    const title = titleEl ? titleEl.value.trim() : "";
    let mediaUrl = mediaEl ? mediaEl.value.trim() : "";
    const description = descEl ? descEl.value.trim() : "";
    const file = fileInput && fileInput.files ? fileInput.files[0] : null;

    if (!title) return alert("Please enter title/caption!");

    if (type === "video") {
      const isAllowed = await checkDailyVideoLimit(phone, activeTier);
      if (!isAllowed) return;
    }

    let storagePath = "";

    if (file) {
      if (file.size > 50 * 1024 * 1024) return alert("File size 50MB se kam honi chahiye!");

      const publishBtn = document.getElementById("publishBtn");
      const progressContainer = document.getElementById("uploadProgressContainer");
      const progressBar = document.getElementById("uploadProgressBar");
      const statusText = document.getElementById("uploadStatusText");

      if (publishBtn) publishBtn.disabled = true;
      if (progressContainer) progressContainer.style.display = "block";

      try {
        const cleanFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
        storagePath = `posts/${phone}_${Date.now()}_${cleanFileName}`;
        const fileRef = sRef(storage, storagePath);
        const uploadTask = uploadBytesResumable(fileRef, file);

        await new Promise((resolve, reject) => {
          uploadTask.on(
            "state_changed",
            snapshot => {
              const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
              if (progressBar) progressBar.style.width = progress + "%";
              if (statusText) statusText.innerText = `Uploading Reel: ${Math.round(progress)}%`;
            },
            error => { reject(error); },
            async () => {
              mediaUrl = await getDownloadURL(uploadTask.snapshot.ref);
              resolve();
            }
          );
        });
      } catch (uploadErr) {
        console.warn("Storage upload failed:", uploadErr);
        if (publishBtn) publishBtn.disabled = false;
        if (progressContainer) progressContainer.style.display = "none";
        
        if (!mediaUrl) {
          return alert("⚠️ File direct upload nahi ho saki. Kripya YouTube Shorts link ya direct video MP4 URL daal kar publish karein!");
        }
      }
    }

    if (type !== "text" && !mediaUrl) {
      return alert("Select video file or provide direct URL!");
    }

    const newPostRef = push(ref(db, "posts"));
    await set(newPostRef, {
      authorPhone: phone,
      authorName: u.name || "Creator",
      type: type || "video",
      title: title,
      mediaUrl: mediaUrl || "",
      storagePath: storagePath || "",
      description: description || "",
      likesCount: 0,
      createdAt: Date.now()
    });

    alert("Reel published successfully!");
    location.hash = "#feed";
  } catch (error) {
    alert("Publish error: " + error.message);
  }
};

window.deleteMyPost = async (postId, storagePath) => {

  if (!phone && !isAdmin) return alert("Please login first");

  const confirmDelete = confirm("Kya aap sach me is reel ko delete karna chahte hain?");
  if (!confirmDelete) return;

  try {

    const p = postSnap.val();
    if (p.authorPhone !== phone && !isAdmin) {

    }

    if (storagePath) {
      try {

        await deleteObject(fileRef);

    }

    await remove(ref(db, "posts/" + postId));
    await remove(ref(db, "likes/" + postId));

    alert("Reel successfully deleted!");

  }
};

window.likePost = async (postId) => {
  try {
    const userPhone = localStorage.getItem("user");
    if (!userPhone) return alert("Please login to like");

    const postSnap = await get(ref(db, `posts/${postId}`));
    if (!postSnap.exists()) return alert("Post not found");
    const pData = postSnap.val();
    const authorPhone = pData.authorPhone;

    if (userPhone === authorPhone) return alert("You cannot like your own post");

    const likeCheck = await get(ref(db, `likes/${postId}/${userPhone}`));
    if (likeCheck.exists()) return alert("You have already supported this post!");

    await set(ref(db, `likes/${postId}/${userPhone}`), true);

    await update(ref(db, `posts/${postId}`), {
      likesCount: Number(pData.likesCount || 0) + 1
    });

    const actualType = pData.type || "video";
    let creatorPts = actualType === "video" ? 3 : 1;
    let viewerPts = actualType === "video" ? 2 : (actualType === "photo" ? 1 : 0);

    const authorSnap = await get(ref(db, "users/" + authorPhone));
    if (authorSnap.exists()) {
      const aData = authorSnap.val();
      await update(ref(db, "users/" + authorPhone), {
        points: Number(aData.points || 0) + creatorPts
      });
    }

    const today = getTodayDateKey();
    const capRef = ref(db, `userLimits/${userPhone}/${today}/likesCount`);
    const capSnap = await get(capRef);
    const currentLikesToday = Number(capSnap.val() || 0);

    if (viewerPts > 0 && currentLikesToday < 20) {
      const viewerSnap = await get(ref(db, "users/" + userPhone));
      if (viewerSnap.exists()) {
        const vData = viewerSnap.val();
        await update(ref(db, "users/" + userPhone), {
          points: Number(vData.points || 0) + viewerPts
        });
      }
      await set(capRef, currentLikesToday + 1);
    }
    alert(`❤️ Liked successfully!`);
  } catch (err) {
    alert("Like error: " + err.message);
  }
};

    membersHtml = "<table><tr><th>Slot</th><th>Phone</th><th>Action</th></tr>";
    let idx = 1;
    membersSnap.forEach(child => {
      const phone = child.key;
      membersHtml += `
        <tr>
          <td>Slot #${idx}</td>
          <td><b>${phone}</b></td>
          <td><button onclick="removeEliteMember('${phone}')" class="btn-danger" style="width:auto; padding:4px 10px; font-size:11px;">Remove Member</button></td>
        </tr>
      `;
      idx++;
    });
    membersHtml += "</table>";
  }

  const el = document.getElementById("adminElite21Section");
  if (el) {
    el.innerHTML = `
      <h4 style="color:#dfb72c; margin-bottom:6px;">Pending Join Requests (150 USDT)</h4>
      ${pendingHtml}
      <h4 style="color:#dfb72c; margin:15px 0 6px 0;">Current Active Members (Max 21)</h4>
      ${membersHtml}
    `;
  }
}

window.runEliteMonthlyDistribution = async () => {
  const usersSnap = await get(ref(db, "users"));
  let totalInvestmentUSDT = 0;
  if (usersSnap.exists()) {
    usersSnap.forEach(child => {
      const u = child.val();
      totalInvestmentUSDT += Number(u.investment || 0);
    });
  }

  const monthlyPoolUSDT = totalInvestmentUSDT * 0.05;
  if (monthlyPoolUSDT <= 0) return alert("Pool collection is 0 USDT, cannot distribute.");

  const membersSnap = await get(ref(db, "elite21/members"));
  let members = [];
  if (membersSnap.exists()) {
    membersSnap.forEach(child => {
      members.push(child.key);
    });
  }

  if (members.length === 0) return alert("No active members in Elite 21!");

  const equalShareUSDT = (monthlyPoolUSDT * 0.70) / members.length;
  const currentPrice = await getPrice();
  const tokenPerMember = Number((equalShareUSDT / currentPrice).toFixed(2));

  for (const phone of members) {
    const userSnap = await get(ref(db, "users/" + phone));
    if (userSnap.exists()) {
      const u = userSnap.val();
      await update(ref(db, "users/" + phone), {
        balance: Number(((u.balance || 0) + tokenPerMember).toFixed(2))
      });
    }
  }

  alert(`Elite 21 Monthly Distribution Complete! Total Pool: ${monthlyPoolUSDT} USDT. Each of the ${members.length} members received ${tokenPerMember} Temple_DA.`);
};

function autoRelease(phone, u) {
  if (!u.lockDate || !u.locked || u.locked <= 0) return;
  const days = (Date.now() - u.lockDate) / (1000 * 60 * 60 * 24);
  if (days >= 30) {
    const release = u.locked * 0.05;
    update(ref(db, "users/" + phone), {
      balance: Number(((u.balance || 0) + release).toFixed(2)),
      locked: Number((u.locked - release).toFixed(2)),
      lockDate: Date.now()
    });
  }
}
