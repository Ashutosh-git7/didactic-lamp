// 🚀 Auto-Login Function via Wallet DApp Browser
window.connectWalletAndAutoLogin = async () => {
  if (typeof window.ethereum === 'undefined') {
    return alert("Web3 Wallet not detected! Kripya MetaMask, Trust Wallet, ya Binance App ke built-in DApp browser se site open karein.");
  }

  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const walletAddress = accounts[0];
    if (!walletAddress) return alert("Wallet address not found!");

    const usersSnap = await get(ref(db, "users"));
    let foundPhone = null;

    usersSnap.forEach(child => {
      const uData = child.val();
      if (uData.wallet && uData.wallet.toLowerCase() === walletAddress.toLowerCase()) {
        foundPhone = child.key;
      }
    });

    if (foundPhone) {
      localStorage.setItem("user", foundPhone);
      alert("✅ Wallet verified! Auto login successful.");
      location.hash = "#user";
    } else {
      alert("⚠️ Is wallet address se koi account registered nahi hai. Kripya pehle Register karein!");
      location.hash = "#register";
      setTimeout(() => {
        const wInput = document.getElementById("wallet");
        if (wInput) wInput.value = walletAddress;
      }, 500);
    }
  } catch (error) {
    alert("Wallet login failed: " + error.message);
  }
};

window.toggleVideoPlayback = (videoEl) => {
  if (videoEl.paused) {
    videoEl.muted = false;
    videoEl.play();
  } else {
    videoEl.pause();
  }
};

function setupIntersectionAutoplay() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const vid = entry.target.querySelector('video');
      if (vid) {
        if (entry.isIntersecting) {
          vid.play().catch(() => {});
        } else {
          vid.pause();
          vid.muted = true;
        }
      }
    });
  }, { threshold: 0.5 });

  document.querySelectorAll('.reel-item').forEach(el => observer.observe(el));
}

window.withdraw = async () => {

    return alert("Kripya valid Temple_DA withdrawal amount daalein!");
  }

  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return alert("User session nahi mila!");
  const u = snap.val();

  if ((u.investment || 0) <= 0) {
    return alert("Withdrawal ke liye minimum investment hona anivarya hai!");
  }
  
  if (amount > (u.balance || 0)) {
    return alert("Insufficient Temple_DA balance! Aapke paas itna balance nahi hai.");
  }
  
  const userWallet = u.wallet;
  if (!userWallet || !walletRegex.test(userWallet)) {
    return alert("Aapke account ke sath valid BEP20 wallet link nahi hai!");
  }

  if (typeof window.ethereum === 'undefined') {
    return alert("Web3 Wallet detect nahi hua! Kripya MetaMask ya Trust Wallet open karein.");
  }

  try {
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    const provider = new ethers.providers.Web3Provider(window.ethereum);
    const signer = provider.getSigner();

    alert("Temple_DA withdrawal ke liye Web3 Wallet signature confirm karein!");

    const newBalance = Number((u.balance - amount).toFixed(2));

    await update(ref(db, "users/" + phone), {
      balance: newBalance
    });

    await push(ref(db, "withdrawals/history/" + phone), {
      amount: amount,
      asset: "Temple_DA",
      wallet: userWallet,
      timestamp: Date.now(),
      status: "Processed"
    });

    alert(`🎉 Success! ${amount} Temple_DA withdrawal successfully process ho gaya aapke wallet (${userWallet.slice(0, 6)}...) par.`);
    userDashboard();

  } catch (error) {
    console.error("Withdrawal error:", error);
    alert("Withdrawal failed: " + (error.data?.message || error.message));
  }
};

async function checkDailyVideoLimit(phone, userTier) {
  if (userTier === "yearly") return true;

  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

  const postsSnap = await get(ref(db, "posts"));
  let todayVideoCount = 0;

  if (postsSnap.exists()) {
    postsSnap.forEach(s => {
      const p = s.val();
      if (p.authorPhone === phone && p.type === "video" && (p.createdAt || 0) >= startOfDay) {
        todayVideoCount++;
      }
    });
  }

  let maxAllowed = 2;
  if (userTier === "monthly") {
    maxAllowed = 5;
  }

  if (todayVideoCount >= maxAllowed) {
    alert(`⚠️ Daily Video Limit Reached!\nAapke current (${userTier.toUpperCase()}) package ki aaj ki ${maxAllowed} video limit complete ho chuki hai. Unlimited uploads ke liye Elite Yearly package upgrade karein!`);
    return false;
  }
  return true;
}

window.publishTalent = async () => {
  try {
    const phone = localStorage.getItem("user");
    if (!phone) return alert("Please login first");

    const userSnap = await get(ref(db, "users/" + phone));
    const u = userSnap.exists() ? userSnap.val() : {};
    const activeTier = checkAndHandlePackageExpiry(phone, u);

    const typeEl = document.getElementById("talentType");
    const titleEl = document.getElementById("talentTitle");
    const mediaEl = document.getElementById("talentMedia");
    const descEl = document.getElementById("talentText");
    const fileInput = document.getElementById("talentFile");

    const type = typeEl ? typeEl.value : "video";
    const title = titleEl ? titleEl.value.trim() : "";
    let mediaUrl = mediaEl ? mediaEl.value.trim() : "";
    const description = descEl ? descEl.value.trim() : "";
    const file = fileInput && fileInput.files ? fileInput.files[0] : null;

    if (!title) return alert("Please enter title/caption!");

    if (type === "video") {
      const isAllowed = await checkDailyVideoLimit(phone, activeTier);
      if (!isAllowed) return;
    }

    let storagePath = "";

    if (file) {
      if (file.size > 50 * 1024 * 1024) return alert("File size 50MB se kam honi chahiye!");

      const publishBtn = document.getElementById("publishBtn");
      const progressContainer = document.getElementById("uploadProgressContainer");
      const progressBar = document.getElementById("uploadProgressBar");
      const statusText = document.getElementById("uploadStatusText");

      if (publishBtn) publishBtn.disabled = true;
      if (progressContainer) progressContainer.style.display = "block";

      try {
        const cleanFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
        storagePath = `posts/${phone}_${Date.now()}_${cleanFileName}`;
        const fileRef = sRef(storage, storagePath);
        const uploadTask = uploadBytesResumable(fileRef, file);

        await new Promise((resolve, reject) => {
          uploadTask.on(
            "state_changed",
            snapshot => {
              const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
              if (progressBar) progressBar.style.width = progress + "%";
              if (statusText) statusText.innerText = `Uploading Reel: ${Math.round(progress)}%`;
            },
            error => { reject(error); },
            async () => {
              mediaUrl = await getDownloadURL(uploadTask.snapshot.ref);
              resolve();
            }
          );
        });
      } catch (uploadErr) {
        if (publishBtn) publishBtn.disabled = false;
        if (progressContainer) progressContainer.style.display = "none";
        if (!mediaUrl) return alert("⚠️ File direct upload nahi ho saki. YouTube Shorts ya MP4 URL daalein!");
      }
    }

    if (type !== "text" && !mediaUrl) {
      return alert("Select video file or provide direct URL!");
    }

    const newPostRef = push(ref(db, "posts"));
    await set(newPostRef, {
      authorPhone: phone,
      authorName: u.name || "Creator",
      type: type || "video",
      title: title,
      mediaUrl: mediaUrl || "",
      storagePath: storagePath || "",
      description: description || "",
      likesCount: 0,
      createdAt: Date.now()
    });

    alert("Reel published successfully!");
    location.hash = "#feed";
  } catch (error) {
    alert("Publish error: " + error.message);
  }
};

window.likePost = async (postId) => {
  try {
    const userPhone = localStorage.getItem("user");
    if (!userPhone) return alert("Please login to like");

    const postSnap = await get(ref(db, `posts/${postId}`));
    if (!postSnap.exists()) return alert("Post not found");
    const pData = postSnap.val();
    const authorPhone = pData.authorPhone;

    if (userPhone === authorPhone) return alert("You cannot like your own post");

    const likeCheck = await get(ref(db, `likes/${postId}/${userPhone}`));
    if (likeCheck.exists()) return alert("You have already supported this post!");

    await set(ref(db, `likes/${postId}/${userPhone}`), true);
    await update(ref(db, `posts/${postId}`), { likesCount: Number(pData.likesCount || 0) + 1 });

    const actualType = pData.type || "video";
    let creatorPts = actualType === "video" ? 3 : 1;
    let viewerPts = actualType === "video" ? 2 : (actualType === "photo" ? 1 : 0);

    const authorSnap = await get(ref(db, "users/" + authorPhone));
    if (authorSnap.exists()) {
      await update(ref(db, "users/" + authorPhone), { points: Number(authorSnap.val().points || 0) + creatorPts });
    }

    if (viewerPts > 0) {
      const viewerSnap = await get(ref(db, "users/" + userPhone));
      if (viewerSnap.exists()) {
        await update(ref(db, "users/" + userPhone), { points: Number(viewerSnap.val().points || 0) + viewerPts });
      }
    }
    alert("Liked successfully!");
  } catch (err) {
    alert("Like error: " + err.message);
  }
};

    <tr><th>ID</th><th>Name</th><th>Wallet Address</th><th>Package</th><th>Balance</th><th>Invested</th><th>Locked</th><th>Action</th></tr>
    ${rows}
    </table>
    </div>

    <div class="card"><h3 style="color:#dfb72c;">⭐ Pending Temple Elite 21 Requests</h3><div id="pendingElite21"></div></div>
    <div class="card"><h3 style="color:#00ff88;">Pending Creator Package Activations</h3><div id="pendingPackages"></div></div>
    <div class="card"><h3>Pending Withdrawals History</h3><div id="pendingWithdraw"></div></div>
    `;

    loadPendingElite21();
    loadPendingPackages();
    loadPendingWithdraw();
  });
}

window.runMonthlyElite21Distribution = async () => {
  const usersSnap = await get(ref(db, "users"));
  if (!usersSnap.exists()) return alert("No users found");

  const currentPrice = await getPrice();
  let totalNewBusinessUSDT = 0;
  let eliteMembers = [];

  usersSnap.forEach(s => {
    const phone = s.key;
    const u = s.val();
    if (u.monthlyBusiness) totalNewBusinessUSDT += Number(u.monthlyBusiness);
    if (u.elite21 === true) eliteMembers.push(phone);
  });

  if (totalNewBusinessUSDT <= 0 || eliteMembers.length === 0) {
    return alert("⚠️ Distribution Cancelled! No business or active Elite 21 members found.");
  }

  const pool5Percent = totalNewBusinessUSDT * 0.05;
  const perEliteTokens = Number(((pool5Percent * 0.70) / eliteMembers.length / currentPrice).toFixed(2));

  for (const phone of eliteMembers) {
    const snap = await get(ref(db, "users/" + phone));
    if (snap.exists()) {
      await update(ref(db, "users/" + phone), { balance: Number(((snap.val().balance || 0) + perEliteTokens).toFixed(2)) });
    }
  }

  alert(`✅ Monthly Distribution Successful! Distributed ${perEliteTokens} Temple_DA to each Elite member.`);
  adminDashboard();
};

async function loadPendingElite21() {
  const snap = await get(ref(db, "elite21/pending"));
  let html = "";
  snap.forEach(child => {
    const phone = child.key;
    const d = child.val();
    html += `<div class="card" style="border: 1px solid #dfb72c;"><b>User:</b> ${phone} | <b>Name:</b> ${d.name}<br><b>Wallet:</b> <span style="font-family:monospace; color:#00ff88;">${d.wallet || 'N/A'}</span><br><br><button onclick="approveElite21('${phone}')" style="background:#dfb72c; color:#000;">Approve</button><button onclick="rejectElite21('${phone}')" class="btn-danger">Reject</button></div>`;
  });
  document.getElementById("pendingElite21").innerHTML = html || "No pending requests";
}

window.approveElite21 = async (phone) => {
  await update(ref(db, "users/" + phone), { elite21: true });
  await remove(ref(db, "elite21/pending/" + phone));
  alert("Elite member approved!");
  loadPendingElite21();
};

window.rejectElite21 = async (phone) => {
  await remove(ref(db, "elite21/pending/" + phone));
  alert("Elite request rejected");
  loadPendingElite21();
};

async function loadPendingPackages() {
  const snap = await get(ref(db, "packages/pending"));
  let html = "";
  snap.forEach(child => {
    const phone = child.key;
    const d = child.val();
    html += `<div class="card" style="border: 1px solid #00ff88;"><b>User:</b> ${phone} | <b>Tier:</b> ${d.tier.toUpperCase()}<br><b>Wallet:</b> <span style="font-family:monospace; color:#00ff88;">${d.wallet || 'N/A'}</span><br><br><button onclick="approvePackage('${phone}','${d.tier}', ${d.amountUSDT})" style="background:#00ff88; color:#000;">Approve</button><button onclick="rejectPackage('${phone}')" class="btn-danger">Reject</button></div>`;
  });
  document.getElementById("pendingPackages").innerHTML = html || "No pending packages";
}

window.approvePackage = async (phone, tier, usdtAmount) => {
  const activatedAt = Date.now();
  const expiresAt = activatedAt + getPackageDurationMs(tier);
  await update(ref(db, "users/" + phone), { tier, packagePriceUSDT: usdtAmount, packageActivatedAt: activatedAt, packageExpiresAt: expiresAt, packageExpired: false });
  await remove(ref(db, "packages/pending/" + phone));
  alert("Package approved!");
  loadPendingPackages();
};

window.rejectPackage = async (phone) => {
  await remove(ref(db, "packages/pending/" + phone));
  alert("Package rejected");
  loadPendingPackages();
};

async function loadPendingWithdraw() {
  const snap = await get(ref(db, "withdrawals/pending"));
  let html = "";
  snap.forEach(child => {
    const phone = child.key;
    const d = child.val();
    html += `<div class="card"><b>User:</b> ${phone} | <b>Amount:</b> ${d.amount} Temple_DA<br><b>Wallet:</b> <span style="font-family:monospace; color:#00ff88;">${d.wallet || 'N/A'}</span></div>`;
  });
  document.getElementById("pendingWithdraw").innerHTML = html || "No pending records";
}

function autoRelease(phone, u) {
  if (!u.lockDate || !u.locked || u.locked <= 0) return;
  const days = (Date.now() - u.lockDate) / (1000 * 60 * 60 * 24);
  if (days >= 30) {
    const release = u.locked * 0.05;
    update(ref(db, "users/" + phone), {
      balance: Number(((u.balance || 0) + release).toFixed(2)),
      locked: Number((u.locked - release).toFixed(2)),
      lockDate: Date.now()
    }).catch(e => {});
  }
}

window.releaseLocked = async phone => {
  const snap = await get(ref(db, "users/" + phone));
  if (!snap.exists()) return alert("User not found");
  const u = snap.val();
  if (!u.locked || u.locked <= 0) return alert("No locked tokens");

  await update(ref(db, "users/" + phone), { balance: (u.balance || 0) + u.locked, locked: 0, lockDate: 0, investment: 0 });
  alert("Tokens released!");
};

window.updatePrice = async () => {
  await set(ref(db, "config/temple_DAPrice"), parseFloat(v("price")));
  alert("Price updated");
};

window.editUser = async oldId => {
  const newId = prompt("Enter new user ID");
  if (!newId) return;
  const snap = await get(ref(db, "users/" + oldId));
  if (!snap.exists()) return alert("User not found");
  await set(ref(db, "users/" + newId), snap.val());
  await remove(ref(db, "users/" + oldId));
  alert("User ID updated");
};

window.deleteUser = async id => { await remove(ref(db, "users/" + id)); };
window.logout = () => { localStorage.removeItem("user"); location.hash = "#login"; };
window.adminLogout = () => { localStorage.removeItem("admin"); location.hash = "#login"; };
